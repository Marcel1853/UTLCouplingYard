[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=An- und Abkuppeln für Unified Train Logistics: Züge lassen Wagen an Bahnhöfen stehen, Rangierloks holen, bringen und stellen sie ab.

[mod-setting-name]
ucy-crawl=Wagenbahnhof: an wartende Wagen heranfahren

[mod-setting-description]
ucy-crawl=Aus: Der Zug kuppelt die Wagen nur, wenn er direkt an ihnen hält – die Haltestelle entsprechend setzen. An: Er fährt langsam an Wagen heran, die bis zu 40 Kacheln vor ihm warten.

[virtual-signal-name]
ucy-relay=Staffel (UTL Coupling Yard)

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Wagenbahnhof
role-yard-tooltip=Züge lassen hier ihre Wagen stehen und holen die Wagen ab, die vor ihnen warten. Danach fahren sie mit ihrem Fahrplan weiter.
role-depot=[img=item/locomotive] Rangierdepot
role-depot-tooltip=Depot für Rangierloks. Sie gehören UTL Coupling Yard, UTL vermittelt sie nie. Eine Rangierlok muss in beide Richtungen fahren: mindestens eine Lok je Richtung.
role-turn=[img=item/rail] Wende
role-turn-tooltip=Hier wechseln Rangierloks die Richtung, damit die Wagen vorn sind.
section=UTL Coupling Yard
mode-swap=Wagen abstellen und abholen
mode-drop=Nur Wagen abstellen
mode-pickup=Nur Wagen abholen
mode-tooltip=Abstellen: Alle Wagen bleiben hier stehen – hinter den Loks (sie fahren vorwärts weiter) oder, wenn geschoben, vor ihnen (sie fahren rückwärts weg).\nAbholen: Der Zug kuppelt die Wagen, die direkt vor ihm warten (Karteneinstellung: auch heranfahren).
hint-yard=Wartebedingungen spielen hier keine Rolle: Der Zug fährt weiter, sobald er fertig ist.
hint-depot=Rangierloks brauchen mindestens eine Lok je Richtung. Ohne Fahrplan bekommen sie dieses Depot als einzigen Halt.
hint-turn=Wird von Rangierloks benutzt.
warn-one-way=[UTL Coupling Yard] Ein Zug im Rangierdepot „__1__“ fährt nur in eine Richtung und wird nicht als Rangierlok benutzt. __2__
warn-cannot-leave=[UTL Coupling Yard] Wagenbahnhof „__1__“: Keine Lok vorn zeigt in Fahrtrichtung – die Wagen bleiben angekuppelt. __2__
warn-cannot-back=[UTL Coupling Yard] Wagenbahnhof „__1__“: Der Zug hat seine Wagen geschoben, aber keine Lok dahinter zeigt nach hinten – die Wagen bleiben angekuppelt. __2__
shunt-to=Wagen rangieren nach:
shunt-to-tooltip=Name eines anderen Wagenbahnhofs. Eine Rangierlok aus einem Rangierdepot holt die hier abgestellten Wagen und bringt sie dorthin. Leer = kein Rangieren.
when-now=sofort
when-empty=wenn leer
when-full=wenn voll
warn-no-target=[UTL Coupling Yard] Wagenbahnhof „__1__“: Kein Wagenbahnhof mit dem Zielnamen gefunden. __2__
warn-shunt-failed=[UTL Coupling Yard] Wagenbahnhof „__1__“: Die Rangierlok konnte die Wagen nicht ankuppeln. __2__
warn-unreachable=[UTL Coupling Yard] Wagenbahnhof „__1__“: Die Rangierlok findet keinen Weg dorthin (Wende bauen?). __2__
relay=Staffel-Nummer:
relay-tooltip=Lieferungen, deren Abnehmer- oder Anbieter-Haltestelle das Signal [virtual-signal=ucy-relay] mit diesem Wert bekommt, halten hier. Der Zug stellt seine Wagen ab, die Lieferung bleibt bei den Wagen, und der nächste Zug, der sie abholt, bringt sie zum Abnehmer. 0 = aus.
warn-not-touching=[UTL Coupling Yard] Wagenbahnhof „__1__“: Der Zug hält nicht direkt an den wartenden Wagen – Haltestelle versetzen oder in den Karteneinstellungen „an wartende Wagen heranfahren“ einschalten. __2__
