warn-no-source=[UTL Coupling Yard] Wagenbahnhof „__1__“: „Wagen anstellen von“ ist leer – der Zug fährt weiter. __2__
mode-tooltip=Anstellen lassen: Der Zug wartet, bis eine Rangierlok Wagen an sein Ende gekuppelt hat (Karteneinstellung).\nAbstellen: Alle Wagen bleiben hier stehen – hinter den Loks (sie fahren vorwärts weiter) oder, wenn geschoben, vor ihnen (sie fahren rückwärts weg).\nAbholen: Der Zug kuppelt die Wagen, die direkt vor ihm warten (Karteneinstellung: auch heranfahren).
hint-yard=Wartebedingungen spielen hier keine Rolle: Der Zug fährt weiter, sobald er fertig ist.
hint-depot=Rangierloks brauchen mindestens eine Lok je Richtung. Ohne Fahrplan bekommen sie dieses Depot als einzigen Halt.
hint-turn=Wird von Rangierloks benutzt.
warn-one-way=[UTL Coupling Yard] Ein Zug im Rangierdepot „__1__“ fährt nur in eine Richtung und wird nicht als Rangierlok benutzt. __2__
warn-cannot-leave=[UTL Coupling Yard] Wagenbahnhof „__1__“: Keine Lok vorn zeigt in Fahrtrichtung – die Wagen bleiben angekuppelt. __2__
warn-cannot-back=[UTL Coupling Yard] Wagenbahnhof „__1__“: Der Zug hat seine Wagen geschoben, aber keine Lok dahinter zeigt nach hinten – die Wagen bleiben angekuppelt. __2__
shunt-to=Wagen rangieren nach:
