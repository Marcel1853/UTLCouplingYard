[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=An- und Abkuppeln für Unified Train Logistics: Züge lassen Wagen an Bahnhöfen stehen, Rangierloks holen, bringen und stellen sie ab.

[mod-setting-name]
ucy-crawl=Wagenbahnhof: an wartende Wagen heranfahren
ucy-attach=Wagenbahnhof: Rangierlok stellt Wagen an wartende Züge
ucy-partial=Wagenbahnhof: Wagen je Rangierfahrt und an stehende Wagen anhängen

[mod-setting-description]
ucy-crawl=Aus: Der Zug kuppelt die Wagen nur, wenn er direkt an ihnen hält – die Haltestelle entsprechend setzen. An: Er fährt langsam an Wagen heran, die bis zu 40 Kacheln vor ihm warten.
ucy-attach=Erlaubt die Betriebsart „Wagen von hinten anstellen lassen“: Ein Zug hält und wartet, eine Rangierlok schiebt Wagen an sein Ende und kuppelt sie an. Der Zug fährt dann gezogen weiter – ohne Lok in Gegenrichtung.
ucy-partial=Erlaubt „Wagen je Rangierfahrt“ (die Rangierlok nimmt nur die ersten N Wagen mit, der Rest bleibt stehen) und „An stehende Wagen anhängen“ (Wagen werden an Wagen gekuppelt, die am Ziel schon stehen, z. B. eine Reihe für Direkt-Beladung).

[virtual-signal-name]
ucy-relay=Staffel (UTL Coupling Yard)

