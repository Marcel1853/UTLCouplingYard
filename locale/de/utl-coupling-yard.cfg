relay-tooltip=Lieferungen, deren Abnehmer- oder Anbieter-Haltestelle das Signal [virtual-signal=ucy-relay] mit diesem Wert bekommt, halten hier. Der Zug stellt seine Wagen ab, die Lieferung bleibt bei den Wagen, und der nächste Zug, der sie abholt, bringt sie zum Abnehmer. 0 = aus.
warn-not-touching=[UTL Coupling Yard] Wagenbahnhof „__1__“: Der Zug hält nicht direkt an den wartenden Wagen – Haltestelle versetzen oder in den Karteneinstellungen „an wartende Wagen heranfahren“ einschalten. __2__
gate=Zuglimit steuern
gate-tooltip=Abstellen: Kein Zug kommt, solange dort noch Wagen stehen, wo er halten würde. Abholen: Kein Zug kommt, bis Wagen direkt vor dem Halt warten. Setzt das Zuglimit der Haltestelle auf 0 bzw. aus.

