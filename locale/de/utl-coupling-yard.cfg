when-now=sofort
when-empty=wenn leer
when-full=wenn voll
warn-no-target=[UTL Coupling Yard] Wagenbahnhof „__1__“: Kein Wagenbahnhof mit dem Zielnamen gefunden. __2__
warn-shunt-failed=[UTL Coupling Yard] Wagenbahnhof „__1__“: Die Rangierlok konnte die Wagen nicht ankuppeln. __2__
warn-unreachable=[UTL Coupling Yard] Wagenbahnhof „__1__“: Die Rangierlok findet keinen Weg dorthin (Wende bauen?). __2__
