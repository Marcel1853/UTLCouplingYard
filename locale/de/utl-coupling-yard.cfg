[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=An- und Abkuppeln für Unified Train Logistics: Züge lassen Wagen an Bahnhöfen stehen, Rangierloks holen, bringen und stellen sie ab.

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Wagenbahnhof
role-yard-tooltip=Züge lassen hier ihre Wagen stehen und holen die Wagen ab, die vor ihnen warten. Danach fahren sie mit ihrem Fahrplan weiter.
role-depot=[img=item/locomotive] Rangierdepot
role-depot-tooltip=Depot für Rangierloks. Sie gehören UTL Coupling Yard, UTL vermittelt sie nie. Eine Rangierlok muss in beide Richtungen fahren: mindestens eine Lok je Richtung.
role-turn=[img=item/rail] Wende
role-turn-tooltip=Hier wechseln Rangierloks die Richtung, damit die Wagen vorn sind.
section=UTL Coupling Yard
mode-swap=Wagen abstellen und abholen
mode-drop=Nur Wagen abstellen
mode-pickup=Nur Wagen abholen
mode-tooltip=Abstellen: Alle Wagen hinter den Loks bleiben hier stehen.\nAbholen: Der Zug fährt langsam vor und kuppelt die Wagen, die vor ihm warten (bis 40 Kacheln).
hint-yard=Wartebedingungen spielen hier keine Rolle: Der Zug fährt weiter, sobald er fertig ist.
hint-depot=Rangierloks brauchen mindestens eine Lok je Richtung.
hint-turn=Wird von Rangierloks benutzt.
warn-one-way=[UTL Coupling Yard] Ein Zug im Rangierdepot „__1__“ fährt nur in eine Richtung und wird nicht als Rangierlok benutzt. __2__
warn-cannot-leave=[UTL Coupling Yard] Wagenbahnhof „__1__“: Keine Lok vorn zeigt in Fahrtrichtung – die Wagen bleiben angekuppelt. __2__
warn-no-loco-ahead=[UTL Coupling Yard] Wagenbahnhof „__1__“: Der Zug kam mit den Wagen voran – die Wagen bleiben angekuppelt. __2__
