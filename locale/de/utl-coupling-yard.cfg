[tips-and-tricks-item-description]
ucy-overview=Einer Haltestelle im UTL-Stationsfenster die Rolle [font=default-bold]Wagenbahnhof[/font] geben. Ein Zug, der dort hält, lässt alle Wagen hinter seinen Loks stehen und fährt mit seinem Fahrplan weiter – Wartebedingungen an diesem Halt spielen keine Rolle.\n\nBetriebsarten: abstellen und abholen, nur abstellen, nur abholen und (Karteneinstellung) Wagen von hinten anstellen lassen. Jedes Kuppeln wird bei UTL angemeldet, Lieferungen und Fahrpläne überstehen es.
ucy-pickup=Mit [font=default-bold]Nur Wagen abholen[/font] (oder abstellen und abholen) kuppelt der Zug die Wagen, die direkt vor dem Halt warten. Die Haltestelle so setzen, dass der Zug direkt an den Wagen hält, oder die Karteneinstellung „an wartende Wagen heranfahren“ einschalten – dann fährt er bis zu 40 Kacheln langsam heran.\n\n[font=default-bold]Zuglimit steuern[/font] hält Züge fern, bis Wagen warten.
ucy-shunting=An einem Wagenbahnhof bei [font=default-bold]Wagen rangieren nach:[/font] den Namen eines anderen Wagenbahnhofs eintragen und wählen, wann: sofort, wenn leer oder wenn voll. Eine freie Lok aus einem [font=default-bold]Rangierdepot[/font] holt die Wagen und schiebt sie dorthin – über die nächste [font=default-bold]Wende[/font], wenn sie die Richtung wechseln muss.\n\nRangierloks brauchen mindestens eine Lok je Richtung. Mehrere Wagenbahnhöfe dürfen gleich heißen: Die Lok nimmt einen freien.
ucy-attach=Betriebsart [font=default-bold]Wagen von hinten anstellen lassen[/font]: Der Zug hält und wartet. Eine Rangierlok holt Wagen vom Wagenbahnhof aus [font=default-bold]Wagen anstellen von:[/font], schiebt sie an das Ende des Zuges und kuppelt sie an. Der Zug fährt dann gezogen weiter – ein Streckenzug braucht keine Lok in Gegenrichtung.\n\nIn den Karteneinstellungen abschaltbar.
ucy-queue=[font=default-bold]Wagen je Rangierfahrt[/font]: Die Rangierlok nimmt nur so viele Wagen mit (die an ihrem Ende); der Rest bleibt stehen und kommt bei der nächsten Fahrt dran.\n[font=default-bold]An stehende Wagen anhängen[/font]: Wagen kommen auch dann ans Ziel, wenn dort schon Wagen stehen, und werden hinten angekuppelt – eine Wagenreihe, z. B. zum Beladen direkt aus Wagen in Maschinen.\n\nIn den Karteneinstellungen abschaltbar.
ucy-relay=Einem Wagenbahnhof eine [font=default-bold]Staffel-Nummer[/font] geben und das Signal [virtual-signal=ucy-relay] mit dieser Zahl an die Haltestelle eines Abnehmers (oder Anbieters) legen. Lieferungen halten nach dem Beladen am Wagenbahnhof: Der Zug stellt seine Wagen ab und fährt ins Depot. [font=default-bold]Die Lieferung bleibt bei den Wagen[/font] – der nächste Zug, der sie abholt, bringt sie weiter.
ucy-signals=Abgestellte Wagen belegen ihren Signalblock, und in einen belegten Block fährt kein Zug ein. Jedem Abstellgleis einen eigenen Block geben, Wagen nicht in den Fahrweg durchfahrender Züge stellen und der Rangierlok etwa 16 Kacheln vor dem Ende der Wagen einen freien Block lassen.\n\nWo ein Zug über ein Signal hinweg ankuppelt, seinen Halt ein paar Felder vor das Signal setzen und „an wartende Wagen heranfahren“ einschalten.
