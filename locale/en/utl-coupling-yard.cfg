[tips-and-tricks-item-description]
ucy-overview=Give a train stop the role [font=default-bold]Wagon yard[/font] in the UTL station window. A train that stops there leaves all wagons behind its locomotives and carries on with its schedule – wait conditions at this stop do not matter.\n\nModes: leave and pick up, only leave, only pick up, and (map setting) have wagons attached from behind. Every coupling is announced to UTL, so deliveries and schedules survive it.
ucy-pickup=With [font=default-bold]Only pick up wagons[/font] (or leave and pick up) the train couples the wagons waiting right ahead of the stop. Place the stop so the train stops right at the wagons, or turn on the map setting "move up to waiting wagons" – then it moves up to 40 tiles slowly.\n\n[font=default-bold]Control train limit[/font] keeps trains away until wagons are waiting.
ucy-shunting=In a wagon yard, enter [font=default-bold]Shunt wagons to:[/font] the name of another wagon yard and choose when: right away, when empty or when full. A free locomotive from a [font=default-bold]Shunting depot[/font] fetches the wagons and pushes them there – via the nearest [font=default-bold]Turnaround[/font] if it has to change direction.\n\nShunting locomotives need at least one locomotive facing each way. Several wagon yards may share a name: the locomotive takes a free one.
ucy-attach=Mode [font=default-bold]Have wagons attached from behind[/font]: the train stops and waits. A shunting locomotive fetches wagons from the wagon yard named in [font=default-bold]Attach wagons from:[/font], pushes them up to the rear of the train and couples them. The train then leaves pulling them – a mainline train needs no locomotive facing backwards.\n\nCan be switched off in the map settings.
ucy-queue=[font=default-bold]Wagons per shunting trip[/font]: the shunting locomotive takes only that many wagons (the ones at its end); the rest stays and is fetched on the next trip.\n[font=default-bold]Add to standing wagons[/font]: wagons are brought to the target even if wagons stand there already, and coupled to their end – a queue, e.g. for loading directly from wagons into machines.\n\nCan be switched off in the map settings.
ucy-relay=Give a wagon yard a [font=default-bold]relay number[/font] and wire the signal [virtual-signal=ucy-relay] with that number to the stop of a requester (or provider). Deliveries stop at the wagon yard after loading: the train leaves its wagons there and returns to its depot. [font=default-bold]The delivery stays with the wagons[/font] – the next train that picks them up takes it on.
ucy-signals=Parked wagons occupy their signal block, and no train enters an occupied block. Give every parking track its own block, keep wagons out of the path of passing trains, and leave a free block about 16 tiles before the end of the wagons for the shunting locomotive.\n\nWhere a train couples across a signal, place its stop a few tiles before the signal and turn on "move up to waiting wagons".
