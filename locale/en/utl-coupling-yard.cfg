[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Coupling and uncoupling for Unified Train Logistics: trains leave wagons at stations, shunting locomotives fetch, bring and park them.

[mod-setting-name]
ucy-crawl=Wagon yard: move up to waiting wagons
ucy-attach=Wagon yard: shunting locomotive attaches wagons to waiting trains
ucy-partial=Wagon yard: wagons per trip and adding to standing wagons

[mod-setting-description]
ucy-crawl=Off: the train couples the wagons only if it stops right at them – place the stop so it does. On: it moves slowly up to wagons waiting within 40 tiles.
ucy-attach=Allows the mode "Have wagons attached from behind": a train stops and waits, a shunting locomotive pushes wagons up to its rear and couples them. The train then leaves pulling them – no locomotive facing backwards needed.
ucy-partial=Allows "Wagons per shunting trip" (the shunting locomotive takes only the first N wagons, the rest stays) and "Add to standing wagons" (wagons are coupled to wagons already standing at the target, e.g. a queue for direct insertion).

