[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Coupling and uncoupling for Unified Train Logistics: trains leave wagons at stations, shunting locomotives fetch, bring and park them.

[mod-setting-name]
ucy-crawl=Wagon yard: move up to waiting wagons

[mod-setting-description]
ucy-crawl=Off: the train couples the wagons only if it stops right at them – place the stop so it does. On: it moves slowly up to wagons waiting within 40 tiles.

[virtual-signal-name]
ucy-relay=Relay (UTL Coupling Yard)

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Wagon yard
role-yard-tooltip=Trains leave their wagons here and pick up the wagons waiting ahead of them. Then they carry on with their schedule.
role-depot=[img=item/locomotive] Shunting depot
role-depot-tooltip=Depot for shunting locomotives. They belong to UTL Coupling Yard, UTL never dispatches them. A shunting locomotive must drive both ways: at least one locomotive per direction.
role-turn=[img=item/rail] Turnaround
role-turn-tooltip=Shunting locomotives change direction here, so the wagons end up in front.
section=UTL Coupling Yard
mode-swap=Leave and pick up wagons
mode-drop=Only leave wagons
mode-pickup=Only pick up wagons
mode-tooltip=Leave: all wagons stay here – behind the locomotives (they carry on forwards) or, if pushed in, in front of them (they back off).\nPick up: the train couples the wagons waiting right ahead of it (map setting: also move up to them).
hint-yard=Wait conditions do not matter here: the train carries on as soon as it is done.
hint-depot=Shunting locomotives need at least one locomotive per direction. Without a schedule they get this depot as their only stop.
hint-turn=Used by shunting locomotives.
warn-one-way=[UTL Coupling Yard] A train in shunting depot "__1__" only drives one way and is not used as shunting locomotive. __2__
warn-cannot-leave=[UTL Coupling Yard] Wagon yard "__1__": no locomotive at the front faces the direction of travel – wagons stay coupled. __2__
warn-cannot-back=[UTL Coupling Yard] Wagon yard "__1__": the train pushed its wagons in, but no locomotive behind them faces backwards – wagons stay coupled. __2__
shunt-to=Shunt wagons to:
shunt-to-tooltip=Name of another wagon yard. A shunting locomotive from a shunting depot fetches the wagons left here and brings them there. Empty = no shunting.
when-now=right away
when-empty=when empty
when-full=when full
warn-no-target=[UTL Coupling Yard] Wagon yard "__1__": no wagon yard with the target name found. __2__
warn-shunt-failed=[UTL Coupling Yard] Wagon yard "__1__": the shunting locomotive could not couple the wagons. __2__
warn-unreachable=[UTL Coupling Yard] Wagon yard "__1__": the shunting locomotive finds no way there (add a turnaround?). __2__
relay=Relay number:
relay-tooltip=Deliveries whose requester or provider stop gets the signal [virtual-signal=ucy-relay] with this value stop here. The train leaves its wagons, the delivery stays with the wagons, and the next train picking them up takes it on to the requester. 0 = off.
warn-not-touching=[UTL Coupling Yard] Wagon yard "__1__": the train did not stop right at the waiting wagons – move the stop or turn on "move up to waiting wagons" in the map settings. __2__
