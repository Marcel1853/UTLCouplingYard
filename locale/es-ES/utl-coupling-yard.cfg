[tips-and-tricks-item-description]
ucy-overview=Da a una parada el rol [font=default-bold]Estación de vagones[/font] en la ventana de estación UTL. Un tren que se detiene allí deja todos los vagones detrás de sus locomotoras y sigue con su horario – las condiciones de espera de esta parada no importan.\n\nModos: dejar y recoger, solo dejar, solo recoger y (ajuste del mapa) que enganchen vagones por detrás. Cada enganche se comunica a UTL, así entregas y horarios lo superan.
ucy-pickup=Con [font=default-bold]Solo recoger vagones[/font] (o dejar y recoger) el tren engancha los vagones que esperan justo delante de la parada. Coloca la parada para que el tren se detenga justo junto a los vagones, o activa el ajuste del mapa «acercarse a los vagones en espera» – entonces se acerca despacio hasta 40 casillas.\n\n[font=default-bold]Controlar el límite de trenes[/font] mantiene alejados los trenes hasta que esperan vagones.
ucy-shunting=En una estación de vagones, escribe en [font=default-bold]Maniobrar vagones a:[/font] el nombre de otra estación de vagones y elige cuándo: enseguida, cuando estén vacíos o cuando estén llenos. Una locomotora libre de un [font=default-bold]depósito de maniobras[/font] recoge los vagones y los empuja hasta allí – pasando por el [font=default-bold]cambio de sentido[/font] más cercano si tiene que cambiar de sentido.\n\nLas locomotoras de maniobras necesitan al menos una locomotora por sentido. Varias estaciones de vagones pueden llamarse igual: la locomotora elige una libre.
ucy-attach=Modo [font=default-bold]Que enganchen vagones por detrás[/font]: el tren se detiene y espera. Una locomotora de maniobras recoge vagones de la estación de vagones indicada en [font=default-bold]Enganchar vagones desde:[/font], los empuja hasta la parte trasera del tren y los engancha. Después el tren sigue tirando de ellos – un tren de línea no necesita locomotora mirando hacia atrás.\n\nSe puede desactivar en los ajustes del mapa.
ucy-queue=[font=default-bold]Vagones por viaje de maniobras[/font]: la locomotora de maniobras solo se lleva ese número de vagones (los de su lado); el resto se queda para el siguiente viaje.\n[font=default-bold]Añadir a vagones parados[/font]: los vagones se llevan al destino aunque ya haya vagones, y se enganchan al final – una fila, p. ej. para cargar directamente desde vagones a máquinas.\n\nSe puede desactivar en los ajustes del mapa.
ucy-relay=Da a una estación de vagones un [font=default-bold]número de relevo[/font] y conecta la señal [virtual-signal=ucy-relay] con ese número a la parada de un solicitante (o proveedor). Tras cargar, las entregas se detienen en la estación de vagones: el tren deja allí sus vagones y vuelve a su depósito. [font=default-bold]La entrega se queda con los vagones[/font] – el siguiente tren que los recoge la continúa.
ucy-signals=Los vagones aparcados ocupan su bloque de señales, y ningún tren entra en un bloque ocupado. Da a cada vía de estacionamiento su propio bloque, mantén los vagones fuera del camino de los trenes que pasan y deja a la locomotora de maniobras un bloque libre unas 16 casillas antes del final de los vagones.\n\nDonde un tren engancha a través de una señal, coloca su parada unas casillas antes de la señal y activa «acercarse a los vagones en espera».
