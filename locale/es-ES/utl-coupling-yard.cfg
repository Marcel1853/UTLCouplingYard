[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Enganchar y desenganchar para Unified Train Logistics: los trenes dejan vagones en las estaciones, las locomotoras de maniobras los recogen, los llevan y los aparcan.

[mod-setting-name]
ucy-crawl=Estación de vagones: acercarse a los vagones en espera
ucy-attach=Estación de vagones: la locomotora de maniobras engancha vagones a trenes en espera (beta)
ucy-partial=Estación de vagones: vagones por viaje y añadir a vagones parados

[mod-setting-description]
ucy-crawl=Desactivado: el tren solo engancha los vagones si se detiene justo junto a ellos – coloca la parada en consecuencia. Activado: se acerca despacio a los vagones que esperan a menos de 40 casillas. Las locomotoras de maniobras siempre se acercan solas a los vagones – con este ajuste a paso lento, sin él a velocidad normal frenando.
ucy-attach=Permite el modo «Que enganchen vagones por detrás»: un tren se detiene y espera, una locomotora de maniobras empuja vagones hasta su parte trasera y los engancha. Después el tren sigue tirando de ellos – sin locomotora mirando hacia atrás.
ucy-partial=Permite «Vagones por viaje de maniobras» (la locomotora de maniobras solo se lleva los N primeros vagones, el resto se queda) y «Añadir a vagones parados» (los vagones se enganchan a los que ya están en el destino, p. ej. una fila para carga directa).

[virtual-signal-name]
ucy-relay=Relevo (UTL Coupling Yard)

