[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Enganchar y desenganchar para Unified Train Logistics: los trenes dejan vagones en las estaciones, las locomotoras de maniobras los recogen, los llevan y los aparcan.

[mod-setting-name]
ucy-crawl=Estación de vagones: acercarse a los vagones en espera

[mod-setting-description]
ucy-crawl=Desactivado: el tren solo engancha los vagones si se detiene justo junto a ellos – coloca la parada en consecuencia. Activado: se acerca despacio a los vagones que esperan a menos de 40 casillas.

[virtual-signal-name]
ucy-relay=Relevo (UTL Coupling Yard)

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Estación de vagones
role-yard-tooltip=Los trenes dejan aquí sus vagones y recogen los vagones que esperan delante. Después siguen con su horario.
role-depot=[img=item/locomotive] Depósito de maniobras
role-depot-tooltip=Depósito para locomotoras de maniobras. Pertenecen a UTL Coupling Yard, UTL nunca las asigna. Una locomotora de maniobras debe circular en ambos sentidos: al menos una locomotora por sentido.
role-turn=[img=item/rail] Cambio de sentido
role-turn-tooltip=Aquí las locomotoras de maniobras cambian de sentido, para que los vagones queden delante.
section=UTL Coupling Yard
mode-swap=Dejar y recoger vagones
mode-drop=Solo dejar vagones
mode-pickup=Solo recoger vagones
mode-tooltip=Dejar: todos los vagones se quedan aquí – detrás de las locomotoras (que siguen hacia delante) o, si se empujaron, delante de ellas (que retroceden).\nRecoger: el tren engancha los vagones que esperan justo delante (ajuste del mapa: también acercarse a ellos).
hint-yard=Las condiciones de espera no importan aquí: el tren sigue en cuanto termina.
hint-depot=Las locomotoras de maniobras necesitan al menos una locomotora por sentido. Sin horario reciben este depósito como única parada.
hint-turn=Lo usan las locomotoras de maniobras.
warn-one-way=[UTL Coupling Yard] Un tren del depósito de maniobras «__1__» solo circula en un sentido y no se usa como locomotora de maniobras. __2__
warn-cannot-leave=[UTL Coupling Yard] Estación de vagones «__1__»: ninguna locomotora delantera mira en el sentido de la marcha – los vagones siguen enganchados. __2__
warn-cannot-back=[UTL Coupling Yard] Estación de vagones «__1__»: el tren empujó sus vagones, pero ninguna locomotora detrás de ellos mira hacia atrás – los vagones siguen enganchados. __2__
shunt-to=Maniobrar vagones a:
shunt-to-tooltip=Nombre de otra estación de vagones. Una locomotora de un depósito de maniobras recoge los vagones dejados aquí y los lleva allí. Vacío = sin maniobras.
when-now=enseguida
when-empty=cuando estén vacíos
when-full=cuando estén llenos
warn-no-target=[UTL Coupling Yard] Estación de vagones «__1__»: no hay ninguna estación de vagones con el nombre de destino. __2__
warn-shunt-failed=[UTL Coupling Yard] Estación de vagones «__1__»: la locomotora de maniobras no pudo enganchar los vagones. __2__
warn-unreachable=[UTL Coupling Yard] Estación de vagones «__1__»: la locomotora de maniobras no encuentra camino (¿añadir un cambio de sentido?). __2__
relay=Número de relevo:
relay-tooltip=Las entregas cuya parada de solicitante o proveedor recibe la señal [virtual-signal=ucy-relay] con este valor se detienen aquí. El tren deja sus vagones, la entrega se queda con los vagones y el siguiente tren que los recoge la lleva al solicitante. 0 = desactivado.
warn-not-touching=[UTL Coupling Yard] Estación de vagones «__1__»: el tren no se detuvo justo junto a los vagones en espera – mueve la parada o activa «acercarse a los vagones en espera» en los ajustes del mapa. __2__
gate=Controlar el límite de trenes
gate-tooltip=Dejar: no viene ningún tren mientras haya vagones donde se detendría. Recoger: no viene ningún tren hasta que esperen vagones justo delante de la parada. Pone el límite de trenes de la parada a 0 o lo desactiva.
