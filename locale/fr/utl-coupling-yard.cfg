[tips-and-tricks-item-description]
ucy-overview=Donnez à un arrêt le rôle [font=default-bold]Gare de wagons[/font] dans la fenêtre de station UTL. Un train qui s'y arrête laisse tous les wagons derrière ses locomotives et continue son horaire – les conditions d'attente de cet arrêt n'ont pas d'importance.\n\nModes : laisser et prendre, laisser seulement, prendre seulement et (paramètre de carte) faire atteler des wagons par l'arrière. Chaque attelage est annoncé à UTL, les livraisons et les horaires y survivent.
ucy-pickup=Avec [font=default-bold]Prendre des wagons seulement[/font] (ou laisser et prendre), le train attelle les wagons qui attendent juste devant l'arrêt. Placez l'arrêt pour que le train s'arrête juste devant les wagons, ou activez le paramètre de carte « s'approcher des wagons en attente » – il s'approche alors lentement jusqu'à 40 cases.\n\n[font=default-bold]Gérer la limite de trains[/font] tient les trains à l'écart tant qu'aucun wagon n'attend.
ucy-shunting=Dans une gare de wagons, entrez dans [font=default-bold]Manœuvrer les wagons vers :[/font] le nom d'une autre gare de wagons et choisissez quand : tout de suite, une fois vides ou une fois pleins. Une locomotive libre d'un [font=default-bold]dépôt de manœuvre[/font] va chercher les wagons et les y pousse – via le [font=default-bold]rebroussement[/font] le plus proche si elle doit changer de sens.\n\nLes locomotives de manœuvre ont besoin d'au moins une locomotive par sens. Plusieurs gares de wagons peuvent porter le même nom : la locomotive en prend une libre.
ucy-attach=Mode [font=default-bold]Faire atteler des wagons par l'arrière[/font] : le train s'arrête et attend. Une locomotive de manœuvre va chercher des wagons dans la gare de wagons indiquée dans [font=default-bold]Atteler des wagons depuis :[/font], les pousse jusqu'à l'arrière du train et les attelle. Le train repart ensuite en les tirant – un train de ligne n'a pas besoin de locomotive tournée vers l'arrière.\n\nDésactivable dans les paramètres de carte.
ucy-queue=[font=default-bold]Wagons par trajet de manœuvre[/font] : la locomotive de manœuvre ne prend que ce nombre de wagons (ceux de son côté) ; le reste attend le trajet suivant.\n[font=default-bold]Ajouter aux wagons en attente[/font] : les wagons sont amenés à la destination même s'il y en a déjà, et attelés à leur fin – une file, p. ex. pour charger directement des wagons dans des machines.\n\nDésactivable dans les paramètres de carte.
ucy-relay=Donnez à une gare de wagons un [font=default-bold]numéro de relais[/font] et reliez le signal [virtual-signal=ucy-relay] avec ce numéro à l'arrêt d'un demandeur (ou d'un fournisseur). Après le chargement, les livraisons s'arrêtent à la gare de wagons : le train y laisse ses wagons et retourne à son dépôt. [font=default-bold]La livraison reste avec les wagons[/font] – le prochain train qui les prend la poursuit.
ucy-signals=Les wagons garés occupent leur bloc de signalisation, et aucun train n'entre dans un bloc occupé. Donnez à chaque voie de garage son propre bloc, gardez les wagons hors du chemin des trains de passage et laissez à la locomotive de manœuvre un bloc libre environ 16 cases avant la fin des wagons.\n\nLà où un train attelle à travers un signal, placez son arrêt quelques cases avant le signal et activez « s'approcher des wagons en attente ».
