[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Attelage et dételage pour Unified Train Logistics : les trains laissent des wagons dans les gares, des locomotives de manœuvre vont les chercher, les amènent et les garent.

[mod-setting-name]
ucy-crawl=Gare de wagons : s'approcher des wagons en attente

[mod-setting-description]
ucy-crawl=Désactivé : le train n'attelle les wagons que s'il s'arrête juste devant eux – placez l'arrêt en conséquence. Activé : il s'approche lentement des wagons qui attendent à moins de 40 cases.

[virtual-signal-name]
ucy-relay=Relais (UTL Coupling Yard)

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Gare de wagons
role-yard-tooltip=Les trains laissent ici leurs wagons et prennent les wagons qui attendent devant eux. Ils continuent ensuite leur horaire.
role-depot=[img=item/locomotive] Dépôt de manœuvre
role-depot-tooltip=Dépôt pour locomotives de manœuvre. Elles appartiennent à UTL Coupling Yard, UTL ne les affecte jamais. Une locomotive de manœuvre doit rouler dans les deux sens : au moins une locomotive par sens.
role-turn=[img=item/rail] Rebroussement
role-turn-tooltip=Les locomotives de manœuvre changent de sens ici, pour que les wagons soient devant.
section=UTL Coupling Yard
mode-swap=Laisser et prendre des wagons
mode-drop=Laisser des wagons seulement
mode-pickup=Prendre des wagons seulement
mode-tooltip=Laisser : tous les wagons restent ici – derrière les locomotives (elles repartent en avant) ou, s'ils ont été poussés, devant elles (elles reculent).\nPrendre : le train attelle les wagons qui attendent juste devant lui (paramètre de carte : s'en approcher aussi).
hint-yard=Les conditions d'attente n'ont pas d'importance ici : le train repart dès qu'il a fini.
hint-depot=Les locomotives de manœuvre ont besoin d'au moins une locomotive par sens. Sans horaire, elles reçoivent ce dépôt comme seul arrêt.
hint-turn=Utilisé par les locomotives de manœuvre.
warn-one-way=[UTL Coupling Yard] Un train du dépôt de manœuvre « __1__ » ne roule que dans un sens et n'est pas utilisé comme locomotive de manœuvre. __2__
warn-cannot-leave=[UTL Coupling Yard] Gare de wagons « __1__ » : aucune locomotive à l'avant ne regarde dans le sens de marche – les wagons restent attelés. __2__
warn-cannot-back=[UTL Coupling Yard] Gare de wagons « __1__ » : le train a poussé ses wagons, mais aucune locomotive derrière eux ne regarde vers l'arrière – les wagons restent attelés. __2__
shunt-to=Manœuvrer les wagons vers :
shunt-to-tooltip=Nom d'une autre gare de wagons. Une locomotive d'un dépôt de manœuvre va chercher les wagons laissés ici et les y amène. Vide = pas de manœuvre.
when-now=tout de suite
when-empty=une fois vides
when-full=une fois pleins
warn-no-target=[UTL Coupling Yard] Gare de wagons « __1__ » : aucune gare de wagons portant le nom cible. __2__
warn-shunt-failed=[UTL Coupling Yard] Gare de wagons « __1__ » : la locomotive de manœuvre n'a pas pu atteler les wagons. __2__
warn-unreachable=[UTL Coupling Yard] Gare de wagons « __1__ » : la locomotive de manœuvre ne trouve pas de chemin (ajouter un rebroussement ?). __2__
relay=Numéro de relais :
relay-tooltip=Les livraisons dont l'arrêt du demandeur ou du fournisseur reçoit le signal [virtual-signal=ucy-relay] avec cette valeur s'arrêtent ici. Le train laisse ses wagons, la livraison reste avec les wagons, et le prochain train qui les prend l'amène au demandeur. 0 = désactivé.
warn-not-touching=[UTL Coupling Yard] Gare de wagons « __1__ » : le train ne s'est pas arrêté juste devant les wagons en attente – déplacez l'arrêt ou activez « s'approcher des wagons en attente » dans les paramètres de carte. __2__
gate=Gérer la limite de trains
gate-tooltip=Laisser : aucun train ne vient tant que des wagons occupent l'endroit où il s'arrêterait. Prendre : aucun train ne vient avant que des wagons attendent juste devant l'arrêt. Met la limite de trains de l'arrêt à 0 ou la désactive.
