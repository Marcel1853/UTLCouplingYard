[tips-and-tricks-item-name]
ucy-overview=UTL Coupling Yard
ucy-pickup=Zabieranie czekających wagonów
ucy-shunting=Lokomotywy manewrowe
ucy-attach=Doczepianie wagonów od tyłu
ucy-queue=Wagony na kurs i kolejki wagonów
ucy-relay=Sztafeta
ucy-signals=Sygnały na stacjach wagonów

[tips-and-tricks-item-description]
ucy-overview=Nadaj przystankowi rolę [font=default-bold]Stacja wagonów[/font] w oknie stacji UTL. Pociąg, który się tam zatrzyma, zostawia wszystkie wagony za lokomotywami i jedzie dalej według rozkładu – warunki oczekiwania na tym przystanku nie mają znaczenia.\n\nTryby: zostaw i zabierz, tylko zostaw, tylko zabierz oraz (ustawienie mapy) doczep wagony od tyłu. Każde sprzęgnięcie jest zgłaszane do UTL, więc dostawy i rozkłady je przetrwają.
ucy-pickup=Przy [font=default-bold]Tylko zabierz wagony[/font] (lub zostaw i zabierz) pociąg sprzęga wagony czekające tuż przed przystankiem. Ustaw przystanek tak, by pociąg zatrzymał się tuż przy wagonach, albo włącz ustawienie mapy „podjeżdżaj do czekających wagonów” – wtedy podjeżdża powoli do 40 pól.\n\n[font=default-bold]Steruj limitem pociągów[/font] trzyma pociągi z dala, dopóki nie czekają wagony.
ucy-shunting=Na stacji wagonów wpisz w [font=default-bold]Przestaw wagony do:[/font] nazwę innej stacji wagonów i wybierz kiedy: od razu, gdy puste lub gdy pełne. Wolna lokomotywa z [font=default-bold]zajezdni manewrowej[/font] odbiera wagony i dopycha je tam – przez najbliższą [font=default-bold]zmianę kierunku[/font], jeśli musi zmienić kierunek.\n\nLokomotywy manewrowe potrzebują co najmniej jednej lokomotywy na kierunek. Kilka stacji wagonów może mieć tę samą nazwę: lokomotywa wybiera wolną.
ucy-attach=Tryb [font=default-bold]Doczep wagony od tyłu[/font]: pociąg zatrzymuje się i czeka. Lokomotywa manewrowa odbiera wagony ze stacji wagonów podanej w [font=default-bold]Doczep wagony z:[/font], dopycha je do końca pociągu i sprzęga. Pociąg odjeżdża, ciągnąc je – pociąg liniowy nie potrzebuje lokomotywy skierowanej do tyłu.\n\nMożna wyłączyć w ustawieniach mapy.
ucy-queue=[font=default-bold]Wagony na kurs manewrowy[/font]: lokomotywa manewrowa zabiera tylko tyle wagonów (tych od swojej strony); reszta czeka na następny kurs.\n[font=default-bold]Doczep do stojących wagonów[/font]: wagony trafiają do celu, nawet jeśli już stoją tam wagony, i są sprzęgane na końcu – kolejka, np. do załadunku prosto z wagonów do maszyn.\n\nMożna wyłączyć w ustawieniach mapy.
ucy-relay=Nadaj stacji wagonów [font=default-bold]numer sztafety[/font] i podłącz sygnał [virtual-signal=ucy-relay] z tym numerem do przystanku odbiorcy (lub dostawcy). Po załadunku dostawy zatrzymują się na stacji wagonów: pociąg zostawia tam wagony i wraca do zajezdni. [font=default-bold]Dostawa zostaje przy wagonach[/font] – następny pociąg, który je zabierze, wiezie ją dalej.
ucy-signals=Odstawione wagony zajmują swój blok sygnalizacyjny, a żaden pociąg nie wjeżdża do zajętego bloku. Daj każdemu torowi odstawczemu własny blok, trzymaj wagony z dala od drogi przejeżdżających pociągów i zostaw lokomotywie manewrowej wolny blok około 16 pól przed końcem wagonów.\n\nTam, gdzie pociąg sprzęga przez sygnał, ustaw jego przystanek kilka pól przed sygnałem i włącz „podjeżdżaj do czekających wagonów”.
