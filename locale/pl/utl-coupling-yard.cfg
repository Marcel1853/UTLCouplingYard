[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Sprzęganie i rozprzęganie dla Unified Train Logistics: pociągi zostawiają wagony na stacjach, lokomotywy manewrowe je odbierają, przewożą i odstawiają.

[mod-setting-name]
ucy-crawl=Stacja wagonów: podjeżdżaj do czekających wagonów

[mod-setting-description]
ucy-crawl=Wyłączone: pociąg sprzęga wagony tylko wtedy, gdy zatrzyma się tuż przy nich – ustaw przystanek odpowiednio. Włączone: podjeżdża powoli do wagonów czekających w odległości do 40 pól.

[virtual-signal-name]
ucy-relay=Sztafeta (UTL Coupling Yard)

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Stacja wagonów
role-yard-tooltip=Pociągi zostawiają tu swoje wagony i zabierają wagony czekające przed nimi. Potem jadą dalej według rozkładu.
role-depot=[img=item/locomotive] Zajezdnia manewrowa
role-depot-tooltip=Zajezdnia dla lokomotyw manewrowych. Należą do UTL Coupling Yard, UTL nigdy ich nie przydziela. Lokomotywa manewrowa musi jeździć w obie strony: co najmniej jedna lokomotywa na kierunek.
role-turn=[img=item/rail] Zmiana kierunku
role-turn-tooltip=Tu lokomotywy manewrowe zmieniają kierunek, aby wagony znalazły się z przodu.
section=UTL Coupling Yard
mode-swap=Zostaw i zabierz wagony
mode-drop=Tylko zostaw wagony
mode-pickup=Tylko zabierz wagony
mode-tooltip=Zostaw: wszystkie wagony zostają tutaj – za lokomotywami (jadą dalej do przodu) albo, jeśli były pchane, przed nimi (cofają się).\nZabierz: pociąg sprzęga wagony czekające tuż przed nim (ustawienie mapy: także podjeżdża do nich).
hint-yard=Warunki oczekiwania nie mają tu znaczenia: pociąg jedzie dalej, gdy tylko skończy.
hint-depot=Lokomotywy manewrowe potrzebują co najmniej jednej lokomotywy na kierunek. Bez rozkładu dostają tę zajezdnię jako jedyny przystanek.
hint-turn=Używane przez lokomotywy manewrowe.
warn-one-way=[UTL Coupling Yard] Pociąg w zajezdni manewrowej „__1__” jeździ tylko w jedną stronę i nie jest używany jako lokomotywa manewrowa. __2__
warn-cannot-leave=[UTL Coupling Yard] Stacja wagonów „__1__”: żadna lokomotywa z przodu nie jest skierowana w kierunku jazdy – wagony pozostają sprzęgnięte. __2__
warn-cannot-back=[UTL Coupling Yard] Stacja wagonów „__1__”: pociąg wepchnął wagony, ale żadna lokomotywa za nimi nie jest skierowana do tyłu – wagony pozostają sprzęgnięte. __2__
shunt-to=Przestaw wagony do:
shunt-to-tooltip=Nazwa innej stacji wagonów. Lokomotywa z zajezdni manewrowej odbiera zostawione tu wagony i przewozi je tam. Puste = bez manewrów.
when-now=od razu
when-empty=gdy puste
when-full=gdy pełne
warn-no-target=[UTL Coupling Yard] Stacja wagonów „__1__”: nie znaleziono stacji wagonów o docelowej nazwie. __2__
warn-shunt-failed=[UTL Coupling Yard] Stacja wagonów „__1__”: lokomotywa manewrowa nie mogła sprzęgnąć wagonów. __2__
warn-unreachable=[UTL Coupling Yard] Stacja wagonów „__1__”: lokomotywa manewrowa nie znajduje drogi (dodać zmianę kierunku?). __2__
relay=Numer sztafety:
relay-tooltip=Dostawy, których przystanek odbiorcy lub dostawcy otrzymuje sygnał [virtual-signal=ucy-relay] o tej wartości, zatrzymują się tutaj. Pociąg zostawia wagony, dostawa zostaje przy wagonach, a następny pociąg, który je zabierze, dowozi ją do odbiorcy. 0 = wyłączone.
warn-not-touching=[UTL Coupling Yard] Stacja wagonów „__1__”: pociąg nie zatrzymał się tuż przy czekających wagonach – przesuń przystanek lub włącz „podjeżdżaj do czekających wagonów” w ustawieniach mapy. __2__
gate=Steruj limitem pociągów
gate-tooltip=Zostaw: żaden pociąg nie przyjeżdża, dopóki tam, gdzie by się zatrzymał, stoją wagony. Zabierz: żaden pociąg nie przyjeżdża, dopóki tuż przed przystankiem nie czekają wagony. Ustawia limit pociągów przystanku na 0 lub go wyłącza.
