[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Engatar e desengatar para Unified Train Logistics: os trens deixam vagões nas estações, locomotivas de manobra os buscam, levam e estacionam.

[mod-setting-name]
ucy-crawl=Pátio de vagões: aproximar-se dos vagões em espera
ucy-attach=Pátio de vagões: locomotiva de manobra engata vagões em trens em espera (beta)
ucy-partial=Pátio de vagões: vagões por viagem e anexar a vagões parados

[mod-setting-description]
ucy-crawl=Desligado: o trem só engata os vagões se parar bem junto a eles – posicione a parada de acordo. Ligado: ele se aproxima devagar dos vagões que esperam a até 40 blocos. Sem ela, as locomotivas de manobra param numa parada de frente para os vagões (como uma transferência em um trilho) e engatam na hora; só onde não houver uma ou houver um sinal no meio, elas fazem o último trecho sozinhas, em velocidade normal.
ucy-attach=Permite o modo "Engatar vagões por trás": um trem para e espera, uma locomotiva de manobra empurra vagões até sua traseira e os engata. Depois o trem segue puxando-os – sem locomotiva voltada para trás.
ucy-partial=Permite "Vagões por viagem de manobra" (a locomotiva de manobra leva só os N primeiros vagões, o resto fica) e "Anexar a vagões parados" (os vagões são engatados aos que já estão no destino, p. ex. uma fila para carga direta).

[virtual-signal-name]
ucy-relay=Revezamento (UTL Coupling Yard)

