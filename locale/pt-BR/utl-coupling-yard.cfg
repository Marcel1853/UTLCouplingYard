[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Engatar e desengatar para Unified Train Logistics: os trens deixam vagões nas estações, locomotivas de manobra os buscam, levam e estacionam.

[mod-setting-name]
ucy-crawl=Pátio de vagões: aproximar-se dos vagões em espera

[mod-setting-description]
ucy-crawl=Desligado: o trem só engata os vagões se parar bem junto a eles – posicione a parada de acordo. Ligado: ele se aproxima devagar dos vagões que esperam a até 40 blocos.

[virtual-signal-name]
ucy-relay=Revezamento (UTL Coupling Yard)

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Pátio de vagões
role-yard-tooltip=Os trens deixam aqui seus vagões e pegam os vagões que esperam à frente. Depois seguem com sua programação.
role-depot=[img=item/locomotive] Depósito de manobra
role-depot-tooltip=Depósito para locomotivas de manobra. Elas pertencem ao UTL Coupling Yard, o UTL nunca as despacha. Uma locomotiva de manobra precisa andar nos dois sentidos: pelo menos uma locomotiva por sentido.
role-turn=[img=item/rail] Retorno
role-turn-tooltip=Aqui as locomotivas de manobra mudam de sentido, para que os vagões fiquem na frente.
section=UTL Coupling Yard
mode-swap=Deixar e pegar vagões
mode-drop=Só deixar vagões
mode-pickup=Só pegar vagões
mode-tooltip=Deixar: todos os vagões ficam aqui – atrás das locomotivas (que seguem em frente) ou, se empurrados, na frente delas (que recuam).\nPegar: o trem engata os vagões que esperam logo à frente (configuração do mapa: também se aproximar deles).
hint-yard=As condições de espera não importam aqui: o trem segue assim que termina.
hint-depot=Locomotivas de manobra precisam de pelo menos uma locomotiva por sentido. Sem programação, recebem este depósito como única parada.
hint-turn=Usado pelas locomotivas de manobra.
warn-one-way=[UTL Coupling Yard] Um trem no depósito de manobra "__1__" só anda em um sentido e não é usado como locomotiva de manobra. __2__
warn-cannot-leave=[UTL Coupling Yard] Pátio de vagões "__1__": nenhuma locomotiva na frente está voltada para o sentido de marcha – os vagões continuam engatados. __2__
warn-cannot-back=[UTL Coupling Yard] Pátio de vagões "__1__": o trem empurrou seus vagões, mas nenhuma locomotiva atrás deles está voltada para trás – os vagões continuam engatados. __2__
shunt-to=Manobrar vagões para:
shunt-to-tooltip=Nome de outro pátio de vagões. Uma locomotiva de um depósito de manobra busca os vagões deixados aqui e os leva para lá. Vazio = sem manobra.
when-now=imediatamente
when-empty=quando vazios
when-full=quando cheios
warn-no-target=[UTL Coupling Yard] Pátio de vagões "__1__": nenhum pátio de vagões com o nome de destino encontrado. __2__
warn-shunt-failed=[UTL Coupling Yard] Pátio de vagões "__1__": a locomotiva de manobra não conseguiu engatar os vagões. __2__
warn-unreachable=[UTL Coupling Yard] Pátio de vagões "__1__": a locomotiva de manobra não encontra caminho até lá (adicionar um retorno?). __2__
relay=Número de revezamento:
relay-tooltip=Entregas cuja parada de solicitante ou fornecedor recebe o sinal [virtual-signal=ucy-relay] com este valor param aqui. O trem deixa seus vagões, a entrega fica com os vagões, e o próximo trem que os pegar a leva ao solicitante. 0 = desligado.
warn-not-touching=[UTL Coupling Yard] Pátio de vagões "__1__": o trem não parou bem junto aos vagões em espera – mova a parada ou ligue "aproximar-se dos vagões em espera" nas configurações do mapa. __2__
gate=Controlar limite de trens
gate-tooltip=Deixar: nenhum trem vem enquanto houver vagões onde ele pararia. Pegar: nenhum trem vem até que vagões esperem logo à frente da parada. Define o limite de trens da parada como 0 ou desligado.
