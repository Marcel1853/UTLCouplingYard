mode-drop=Só deixar vagões
mode-pickup=Só pegar vagões
mode-tooltip=Engatar por trás: o trem espera até uma locomotiva de manobra engatar vagões em sua traseira (configuração do mapa).\nDeixar: todos os vagões ficam aqui – atrás das locomotivas (que seguem em frente) ou, se empurrados, na frente delas (que recuam).\nPegar: o trem engata os vagões que esperam logo à frente (configuração do mapa: também se aproximar deles).
hint-yard=As condições de espera não importam aqui: o trem segue assim que termina.
hint-depot=Locomotivas de manobra precisam de pelo menos uma locomotiva por sentido. Sem programação, recebem este depósito como única parada.
hint-turn=Usado pelas locomotivas de manobra.
