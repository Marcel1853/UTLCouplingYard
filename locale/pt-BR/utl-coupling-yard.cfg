[tips-and-tricks-item-category-name]
ucy=UTL Coupling Yard

[tips-and-tricks-item-name]
ucy-overview=UTL Coupling Yard
ucy-pickup=Pegar vagões em espera
ucy-shunting=Locomotivas de manobra
ucy-attach=Engatar vagões por trás
ucy-queue=Vagões por viagem e filas de vagões
ucy-relay=Revezamento
ucy-signals=Sinais nos pátios de vagões

[tips-and-tricks-item-description]
ucy-overview=Dê a uma parada o papel [font=default-bold]Pátio de vagões[/font] na janela de estação do UTL. Um trem que para ali deixa todos os vagões atrás das locomotivas e segue sua programação – as condições de espera desta parada não importam.\n\nModos: deixar e pegar, só deixar, só pegar e (configuração do mapa) engatar vagões por trás. Cada engate é comunicado ao UTL, então entregas e programações continuam valendo.
ucy-pickup=Com [font=default-bold]Só pegar vagões[/font] (ou deixar e pegar) o trem engata os vagões que esperam logo à frente da parada. Posicione a parada para o trem parar bem junto aos vagões, ou ligue a configuração do mapa "aproximar-se dos vagões em espera" – então ele se aproxima devagar até 40 blocos.\n\n[font=default-bold]Controlar limite de trens[/font] mantém os trens longe até haver vagões esperando.
ucy-shunting=Num pátio de vagões, escreva em [font=default-bold]Manobrar vagões para:[/font] o nome de outro pátio de vagões e escolha quando: imediatamente, quando vazios ou quando cheios. Uma locomotiva livre de um [font=default-bold]depósito de manobra[/font] busca os vagões e os empurra até lá – passando pelo [font=default-bold]retorno[/font] mais próximo se precisar mudar de sentido.\n\nLocomotivas de manobra precisam de pelo menos uma locomotiva por sentido. Vários pátios de vagões podem ter o mesmo nome: a locomotiva escolhe um livre.
ucy-attach=Modo [font=default-bold]Engatar vagões por trás[/font]: o trem para e espera. Uma locomotiva de manobra busca vagões no pátio de vagões indicado em [font=default-bold]Engatar vagões de:[/font], empurra-os até a traseira do trem e os engata. Depois o trem segue puxando-os – um trem de linha não precisa de locomotiva voltada para trás.\n\nPode ser desligado nas configurações do mapa.
ucy-queue=[font=default-bold]Vagões por viagem de manobra[/font]: a locomotiva de manobra leva só essa quantidade de vagões (os do seu lado); o resto fica para a próxima viagem.\n[font=default-bold]Anexar a vagões parados[/font]: os vagões são levados ao destino mesmo que já haja vagões, e engatados no fim – uma fila, p. ex. para carregar direto dos vagões para máquinas.\n\nPode ser desligado nas configurações do mapa.
ucy-relay=Dê a um pátio de vagões um [font=default-bold]número de revezamento[/font] e ligue o sinal [virtual-signal=ucy-relay] com esse número à parada de um solicitante (ou fornecedor). Depois de carregar, as entregas param no pátio de vagões: o trem deixa ali seus vagões e volta ao depósito. [font=default-bold]A entrega fica com os vagões[/font] – o próximo trem que os pegar a continua.
ucy-signals=Vagões estacionados ocupam seu bloco de sinais, e nenhum trem entra num bloco ocupado. Dê a cada trilho de estacionamento seu próprio bloco, mantenha os vagões fora do caminho dos trens que passam e deixe para a locomotiva de manobra um bloco livre cerca de 16 blocos antes do fim dos vagões.\n\nOnde um trem engata através de um sinal, coloque a parada alguns blocos antes do sinal e ligue "aproximar-se dos vagões em espera".
