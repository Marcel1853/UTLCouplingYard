[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=Сцепка и расцепка для Unified Train Logistics: поезда оставляют вагоны на станциях, маневровые локомотивы забирают, перевозят и отставляют их.

[mod-setting-name]
ucy-crawl=Вагонная станция: подъезжать к ожидающим вагонам

[mod-setting-description]
ucy-crawl=Выкл.: поезд сцепляет вагоны, только если останавливается прямо у них – поставьте остановку соответственно. Вкл.: он медленно подъезжает к вагонам, ожидающим в пределах 40 клеток.

[virtual-signal-name]
ucy-relay=Эстафета (UTL Coupling Yard)

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] Вагонная станция
role-yard-tooltip=Поезда оставляют здесь свои вагоны и забирают вагоны, ожидающие перед ними. Затем едут дальше по расписанию.
role-depot=[img=item/locomotive] Маневровое депо
role-depot-tooltip=Депо для маневровых локомотивов. Они принадлежат UTL Coupling Yard, UTL никогда их не назначает. Маневровый локомотив должен ездить в обе стороны: минимум один локомотив на каждое направление.
role-turn=[img=item/rail] Разворот
role-turn-tooltip=Здесь маневровые локомотивы меняют направление, чтобы вагоны оказались впереди.
section=UTL Coupling Yard
mode-swap=Оставить и забрать вагоны
mode-drop=Только оставить вагоны
mode-pickup=Только забрать вагоны
mode-tooltip=Оставить: все вагоны остаются здесь – позади локомотивов (они едут дальше вперёд) или, если их толкали, перед ними (они отъезжают назад).\nЗабрать: поезд сцепляет вагоны, ожидающие прямо перед ним (настройка карты: также подъезжать к ним).
hint-yard=Условия ожидания здесь не важны: поезд едет дальше, как только закончит.
hint-depot=Маневровым локомотивам нужен минимум один локомотив на каждое направление. Без расписания они получают это депо единственной остановкой.
hint-turn=Используется маневровыми локомотивами.
warn-one-way=[UTL Coupling Yard] Поезд в маневровом депо «__1__» ездит только в одну сторону и не используется как маневровый локомотив. __2__
warn-cannot-leave=[UTL Coupling Yard] Вагонная станция «__1__»: ни один локомотив впереди не смотрит по направлению движения – вагоны остаются сцеплены. __2__
warn-cannot-back=[UTL Coupling Yard] Вагонная станция «__1__»: поезд затолкал вагоны, но ни один локомотив позади них не смотрит назад – вагоны остаются сцеплены. __2__
shunt-to=Переставить вагоны на:
shunt-to-tooltip=Название другой вагонной станции. Локомотив из маневрового депо забирает оставленные здесь вагоны и везёт их туда. Пусто = без маневров.
when-now=сразу
when-empty=когда пусты
when-full=когда полны
warn-no-target=[UTL Coupling Yard] Вагонная станция «__1__»: вагонная станция с целевым названием не найдена. __2__
warn-shunt-failed=[UTL Coupling Yard] Вагонная станция «__1__»: маневровый локомотив не смог сцепить вагоны. __2__
warn-unreachable=[UTL Coupling Yard] Вагонная станция «__1__»: маневровый локомотив не находит пути (добавить разворот?). __2__
relay=Номер эстафеты:
relay-tooltip=Доставки, у которых остановка получателя или поставщика получает сигнал [virtual-signal=ucy-relay] с этим значением, останавливаются здесь. Поезд оставляет вагоны, доставка остаётся с вагонами, а следующий поезд, забравший их, везёт её получателю. 0 = выкл.
warn-not-touching=[UTL Coupling Yard] Вагонная станция «__1__»: поезд остановился не прямо у ожидающих вагонов – передвиньте остановку или включите «подъезжать к ожидающим вагонам» в настройках карты. __2__
gate=Управлять лимитом поездов
gate-tooltip=Оставить: поезд не приедет, пока там, где он остановился бы, стоят вагоны. Забрать: поезд не приедет, пока прямо перед остановкой не будут ждать вагоны. Ставит лимит поездов остановки на 0 или выключает его.
