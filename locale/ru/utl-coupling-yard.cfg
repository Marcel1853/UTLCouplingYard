manager-depots=Маневровые депо
manager-turns=Развороты
manager-shunters=Маневровые локомотивы (свободны / всего)
manager-tasks=Маневровые задания (ждут и выполняются)
manager-waiting=Вагоны, ждущие «пусто» / «полно»
manager-attach=Поезда, ждущие прицепки вагонов
warn-no-source=[UTL Coupling Yard] Вагонная станция «__1__»: поле «Прицеплять вагоны с» пусто – поезд едет дальше. __2__

[tips-and-tricks-item-category-name]
ucy=UTL Coupling Yard

[tips-and-tricks-item-name]
ucy-overview=UTL Coupling Yard
ucy-pickup=Забор ожидающих вагонов
ucy-shunting=Маневровые локомотивы
ucy-attach=Прицепка вагонов сзади
ucy-queue=Вагонов за рейс и очереди вагонов
ucy-relay=Эстафета
ucy-signals=Сигналы на вагонных станциях

[tips-and-tricks-item-description]
ucy-overview=Назначьте остановке роль [font=default-bold]Вагонная станция[/font] в окне станции UTL. Поезд, остановившийся там, оставляет все вагоны позади своих локомотивов и едет дальше по расписанию – условия ожидания на этой остановке не важны.\n\nРежимы: оставить и забрать, только оставить, только забрать и (настройка карты) прицепить вагоны сзади. О каждой сцепке сообщается UTL, поэтому доставки и расписания её переживают.
ucy-pickup=В режиме [font=default-bold]Только забрать вагоны[/font] (или оставить и забрать) поезд сцепляет вагоны, ожидающие прямо перед остановкой. Поставьте остановку так, чтобы поезд вставал прямо у вагонов, или включите настройку карты «подъезжать к ожидающим вагонам» – тогда он медленно подъезжает до 40 клеток.\n\n[font=default-bold]Управлять лимитом поездов[/font] не пускает поезда, пока не ждут вагоны.
ucy-shunting=На вагонной станции впишите в [font=default-bold]Переставить вагоны на:[/font] название другой вагонной станции и выберите когда: сразу, когда пусты или когда полны. Свободный локомотив из [font=default-bold]маневрового депо[/font] забирает вагоны и подталкивает их туда – через ближайший [font=default-bold]разворот[/font], если нужно сменить направление.\n\nМаневровым локомотивам нужен минимум один локомотив на каждое направление. Несколько вагонных станций могут называться одинаково: локомотив выберет свободную.
ucy-attach=Режим [font=default-bold]Прицепить вагоны сзади[/font]: поезд останавливается и ждёт. Маневровый локомотив забирает вагоны с вагонной станции, указанной в [font=default-bold]Прицеплять вагоны с:[/font], подталкивает их к хвосту поезда и сцепляет. Затем поезд уезжает, таща их, – магистральному поезду не нужен локомотив, смотрящий назад.\n\nМожно выключить в настройках карты.
ucy-queue=[font=default-bold]Вагонов за маневровый рейс[/font]: маневровый локомотив забирает только столько вагонов (со своей стороны); остальные ждут следующего рейса.\n[font=default-bold]Прицеплять к стоящим вагонам[/font]: вагоны привозятся к цели, даже если там уже стоят вагоны, и прицепляются в конец – очередь, например для загрузки прямо из вагонов в машины.\n\nМожно выключить в настройках карты.
ucy-relay=Дайте вагонной станции [font=default-bold]номер эстафеты[/font] и подайте сигнал [virtual-signal=ucy-relay] с этим номером на остановку получателя (или поставщика). После погрузки доставки останавливаются на вагонной станции: поезд оставляет там вагоны и возвращается в депо. [font=default-bold]Доставка остаётся с вагонами[/font] – следующий поезд, забравший их, везёт её дальше.
ucy-signals=Оставленные вагоны занимают свой блок сигналов, а в занятый блок не въезжает ни один поезд. Дайте каждому пути отстоя свой блок, держите вагоны вне пути проходящих поездов и оставьте маневровому локомотиву свободный блок примерно за 16 клеток до конца вагонов.\n\nГде поезд сцепляется через сигнал, ставьте его остановку за несколько клеток до сигнала и включите «подъезжать к ожидающим вагонам».
