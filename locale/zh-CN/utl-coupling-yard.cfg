[tips-and-tricks-item-category-name]
ucy=UTL Coupling Yard

[tips-and-tricks-item-name]
ucy-overview=UTL Coupling Yard
ucy-pickup=挂上等待的车厢
ucy-shunting=调车机车
ucy-attach=从后方挂上车厢
ucy-queue=每趟车厢数与车厢队列
ucy-relay=接力
ucy-signals=车厢场的信号

[tips-and-tricks-item-description]
ucy-overview=在 UTL 车站窗口中为车站选择角色[font=default-bold]车厢场[/font]。在这里停靠的列车会把机车后方的所有车厢留下，然后按时刻表继续行驶——此车站的等待条件不起作用。\n\n模式：留下并挂上、只留下、只挂上，以及（地图设置）从后方挂上车厢。每次挂车都会通知 UTL，配送和时刻表都不会因此中断。
ucy-pickup=选择[font=default-bold]只挂上车厢[/font]（或留下并挂上）时，列车会挂上正好在车站前方等待的车厢。放置车站时让列车正好停在车厢旁，或开启地图设置“缓慢靠近等待的车厢”——列车会缓慢靠近最多 40 格。\n\n[font=default-bold]控制列车上限[/font]会让列车在有车厢等待前不前来。
ucy-shunting=在车厢场的[font=default-bold]调车目标：[/font]中填写另一个车厢场的名称，并选择时机：立即、空时或满时。[font=default-bold]调车车库[/font]中的空闲机车会取走车厢并推到那里——需要改变方向时会经过最近的[font=default-bold]折返点[/font]。\n\n调车机车每个方向至少需要一台机车。多个车厢场可以同名：机车会选择空闲的一个。
ucy-attach=模式[font=default-bold]从后方挂上车厢[/font]：列车停下等待。调车机车从[font=default-bold]挂车来源：[/font]中填写的车厢场取来车厢，推到列车尾部并挂上。之后列车拉着车厢离开——干线列车不需要朝后的机车。\n\n可在地图设置中关闭。
ucy-queue=[font=default-bold]每趟调车车厢数[/font]：调车机车只带走这么多节车厢（靠它一侧的）；其余留待下一趟。\n[font=default-bold]挂到停放的车厢上[/font]：即使目的地已有车厢，也会把车厢送去并挂在末尾——形成车厢队列，例如直接从车厢向机器装卸。\n\n可在地图设置中关闭。
ucy-relay=为车厢场设置[font=default-bold]接力编号[/font]，并把带有该编号的信号 [virtual-signal=ucy-relay] 接到需求站（或供应站）的车站上。装货后，配送会停靠在车厢场：列车把车厢留在那里并返回车库。[font=default-bold]配送随车厢保留[/font]——下一列挂上它们的列车会继续运送。
ucy-signals=停放的车厢会占用所在的信号区块，列车不会驶入被占用的区块。给每条停车线一个独立的区块，不要让车厢挡住过往列车的路线，并在车厢末端前约 16 格为调车机车留出一个空闲区块。\n\n如果列车要隔着信号挂车，把车站放在信号前几格，并开启“缓慢靠近等待的车厢”。
