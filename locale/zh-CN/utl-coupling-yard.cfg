[mod-name]
UTLCouplingYard=UTL Coupling Yard

[mod-description]
UTLCouplingYard=为 Unified Train Logistics 提供挂车与摘车：列车把车厢留在车站，调车机车负责取走、运送和停放。

[mod-setting-name]
ucy-crawl=车厢场：缓慢靠近等待的车厢

[mod-setting-description]
ucy-crawl=关：只有列车正好停在车厢旁时才会挂上它们——请据此放置车站。开：列车会缓慢靠近 40 格以内等待的车厢。

[virtual-signal-name]
ucy-relay=接力（UTL Coupling Yard）

[utl-coupling-yard]
role-yard=[img=item/cargo-wagon] 车厢场
role-yard-tooltip=列车在这里留下车厢，并挂上在前方等待的车厢，然后按时刻表继续行驶。
role-depot=[img=item/locomotive] 调车车库
role-depot-tooltip=调车机车的车库。它们属于 UTL Coupling Yard，UTL 从不调度它们。调车机车必须能双向行驶：每个方向至少一台机车。
role-turn=[img=item/rail] 折返点
role-turn-tooltip=调车机车在这里改变方向，使车厢位于前方。
section=UTL Coupling Yard
mode-swap=留下并挂上车厢
mode-drop=只留下车厢
mode-pickup=只挂上车厢
mode-tooltip=留下：所有车厢留在这里——在机车后方（机车继续前进），或在被推入时位于机车前方（机车倒车离开）。\n挂上：列车挂上正好在前方等待的车厢（地图设置：也可缓慢靠近）。
hint-yard=这里的等待条件不起作用：列车完成后立即继续行驶。
hint-depot=调车机车每个方向至少需要一台机车。没有时刻表时，此车库会成为它们唯一的车站。
hint-turn=供调车机车使用。
warn-one-way=[UTL Coupling Yard] 调车车库“__1__”中的列车只能单向行驶，不会用作调车机车。__2__
warn-cannot-leave=[UTL Coupling Yard] 车厢场“__1__”：前部没有朝向行驶方向的机车——车厢保持连挂。__2__
warn-cannot-back=[UTL Coupling Yard] 车厢场“__1__”：列车推入了车厢，但车厢后方没有朝后的机车——车厢保持连挂。__2__
shunt-to=调车目标：
shunt-to-tooltip=另一个车厢场的名称。调车车库中的机车会取走留在这里的车厢并送到那里。留空 = 不调车。
when-now=立即
when-empty=空时
when-full=满时
warn-no-target=[UTL Coupling Yard] 车厢场“__1__”：找不到具有目标名称的车厢场。__2__
warn-shunt-failed=[UTL Coupling Yard] 车厢场“__1__”：调车机车无法挂上车厢。__2__
warn-unreachable=[UTL Coupling Yard] 车厢场“__1__”：调车机车找不到通往那里的路线（需要添加折返点？）。__2__
relay=接力编号：
relay-tooltip=若需求站或供应站的车站收到值为此编号的信号 [virtual-signal=ucy-relay]，其配送会在这里停靠。列车留下车厢，配送随车厢保留，下一列挂上它们的列车会把配送送到需求站。0 = 关闭。
warn-not-touching=[UTL Coupling Yard] 车厢场“__1__”：列车没有正好停在等待的车厢旁——请移动车站，或在地图设置中开启“缓慢靠近等待的车厢”。__2__
gate=控制列车上限
gate-tooltip=留下：只要列车停靠的位置仍有车厢，就不会有列车前来。挂上：直到车站正前方有车厢等待时才会有列车前来。会把车站的列车上限设为 0 或关闭。
