scenario-name=UTL Coupling Yard – Großnetz
description=Großes eigenes Netz zum Anschauen: 4 × 3 Kreisel mit zweigleisigen Strecken und Signalen, UTL-Bahnhöfe und 36 UTL-Züge mit echten Lieferungen. In zwei Blöcken je eine Kuppel-Anlage – Erzmine und Fabrik mit Übergabebahnhof und Rangierbahnhof; ein Streckenzug pendelt quer durchs Netz zwischen beiden. Braucht Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – Großnetz[/font]: 36 UTL-Züge fahren Lieferungen durch das Netz. Der Streckenzug bringt leere Wagen zur Erzmine (hier), stellt sie ab, setzt um und holt die vollen; die Rangierlok bringt die Wagen zu den Ladegleisen und wieder zurück. In der Fabrik (unten rechts) dasselbe mit Entladen.

[ucy-sign]
arrive=Ankunft: Streckenzug stellt seine Wagen ab
depart=Abfahrt: Streckenzug holt die bereitgestellten Wagen
ready=Bereitstellung: Rangierlok stellt Wagen für den Streckenzug hin
load=Ladegleise: Greifarme laden Erz
unload=Entladegleise: Greifarme entladen
depot=Rangierdepot (Lok in beide Richtungen)
turn=Wende der Rangierlok
