scenario-name=UTL Coupling Yard – Großnetz
description=Großes eigenes Netz zum Anschauen: 4 × 3 Kreisel mit zweigleisigen Strecken und Signalen, 34 UTL-Bahnhöfe und 36 UTL-Züge mit echten Lieferungen. Dazu zwei Kuppel-Anlagen, deren Erzzüge quer durch dieses Netz zwischen Erzmine und Wagenbahnhof fahren. Braucht Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – Großnetz[/font]: 36 UTL-Züge fahren Lieferungen durch das Netz. Zwei Erzzüge fahren mit ihnen: von der Erzmine (Westen) quer durchs Netz zum Wagenbahnhof (Osten), schieben die vollen Wagen auf das Voll-Gleis und holen leere vom Leer-Gleis. Zug B bringt die vollen zum Entladebahnhof.

[ucy-sign]
ore=Erzmine: Greifarme laden Erz
