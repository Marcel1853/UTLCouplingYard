scenario-name=UTL Coupling Yard – Großnetz
description=Großes eigenes Netz zum Anschauen: 4 × 3 Kreisel mit zweigleisigen Strecken und Signalen, UTL-Bahnhöfe und 33 UTL-Züge mit echten Lieferungen. In zwei Blöcken je eine Kuppel-Anlage – Erzmine und Fabrik mit Übergabebahnhof und Rangierbahnhof; ein Streckenzug pendelt quer durchs Netz zwischen beiden. Braucht Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – Großnetz[/font]: 33 UTL-Züge fahren Lieferungen durch das Netz. Der Streckenzug (eine Lok vorn) bringt leere Wagen zur Erzmine (hier), stellt sie ab, fährt vor zur Abfahrt und wartet dort: Die Rangierlok stellt ihm die vollen Wagen von hinten an, dann fährt er gezogen weiter. Außerdem bringt die Rangierlok die Wagen zu den Ladegleisen und wieder zurück. In der Fabrik (unten rechts) dasselbe mit Entladen. Ohne das Beta-Feature „Wagen anstellen“ (Karteneinstellung, standardmäßig aus) hat der Streckenzug zwei Loks Rücken an Rücken, wendet in der Lokwende und holt die Wagen selbst an der Abholung.

[ucy-sign]
arrive=Ankunft: Streckenzug stellt seine Wagen ab
depart=Abfahrt: Streckenzug wartet, die Rangierlok stellt die bereitgestellten Wagen an
ready=Bereitstellung: Rangierlok stellt Wagen für den Streckenzug hin
load=Ladegleise: Greifarme laden Erz
unload=Entladegleise: Greifarme entladen
depot=Rangierdepot (Lok in beide Richtungen)
turn=Wende der Rangierlok
