scenario-name=UTL Coupling Yard – large network
description=Large network of its own to watch: 4 × 3 roundabouts with double-track lines and signals, 34 UTL stations and 36 UTL trains running real deliveries. Plus two coupling facilities whose ore trains travel across this network between the ore mine and the wagon yard. Requires Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – large network[/font]: 36 UTL trains run deliveries through the network. Two ore trains travel with them: from the ore mine (west) across the network to the wagon yard (east), push the full wagons onto the full track and take empty ones from the empty track. Train B takes the full ones to unloading.

[ucy-sign]
ore=Ore mine: inserters load ore
full-track=Full track: the ore train pushes full wagons in, train B takes them from the other side
empty-track=Empty track: train B pushes empty wagons in, the ore train takes them
unload=Unloading station: inserters unload
