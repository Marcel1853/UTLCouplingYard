scenario-name=UTL Coupling Yard – large network
description=Large network of its own to watch: 4 × 3 roundabouts with double-track lines and signals, UTL stations and 36 UTL trains running real deliveries. Two blocks hold a coupling facility each – an ore mine and a factory, each with a transfer yard and a shunting yard; a mainline train travels across the network between them. Requires Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – large network[/font]: 36 UTL trains run deliveries through the network. The mainline train brings empty wagons to the ore mine (here), leaves them, runs around and takes the full ones; the shunting locomotive moves the wagons to the loading tracks and back. The factory (bottom right) does the same with unloading.

[ucy-sign]
arrive=Arrival: the mainline train leaves its wagons
depart=Departure: the mainline train takes the wagons provided
ready=Provision: the shunting locomotive places wagons for the mainline train
load=Loading tracks: inserters load ore
unload=Unloading tracks: inserters unload
depot=Shunting depot (locomotives facing both ways)
turn=Turning point of the shunting locomotive
