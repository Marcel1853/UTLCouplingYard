scenario-name=UTL Coupling Yard – large network
description=Large network of its own to watch: 4 × 3 roundabouts with double-track lines and signals, UTL stations and 33 UTL trains running real deliveries. Two blocks hold a coupling facility each – an ore mine and a factory, each with a transfer yard and a shunting yard; a mainline train travels across the network between them. Requires Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – large network[/font]: 33 UTL trains run deliveries through the network. The mainline train (one locomotive at the front) brings empty wagons to the ore mine (here), leaves them, moves up to the departure stop and waits there: the shunting locomotive attaches the full wagons to its rear, then it leaves pulling them. The shunting locomotive also moves the wagons to the loading tracks and back. The factory (bottom right) does the same with unloading. Without the beta feature "have wagons attached" (map setting, off by default) the mainline train has two locomotives back to back, turns at the locomotive turnaround and fetches the wagons itself at the pickup stop.

[ucy-sign]
arrive=Arrival: the mainline train leaves its wagons
depart=Departure: the mainline train waits, the shunting locomotive attaches the wagons provided
ready=Provision: the shunting locomotive places wagons for the mainline train
load=Loading tracks: inserters load ore
unload=Unloading tracks: inserters unload
depot=Shunting depot (locomotives facing both ways)
turn=Turning point of the shunting locomotive
