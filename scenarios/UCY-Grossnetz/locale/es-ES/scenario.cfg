scenario-name=UTL Coupling Yard – gran red
description=Gran red propia para observar: 4 × 3 rotondas con líneas de doble vía y señales, estaciones UTL y 33 trenes UTL que hacen entregas reales. Dos bloques tienen cada uno una instalación de enganche – una mina de mineral y una fábrica, cada una con estación de transferencia y estación de clasificación; un tren de línea viaja entre ambas a través de la red. Requiere Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – gran red[/font]: 33 trenes UTL hacen entregas por la red. El tren de línea (una locomotora delante) lleva vagones vacíos a la mina (aquí), los deja, avanza hasta la parada de salida y espera allí: la locomotora de maniobras engancha los vagones llenos a su parte trasera y después sigue tirando de ellos. La locomotora de maniobras también lleva los vagones a las vías de carga y de vuelta. La fábrica (abajo a la derecha) hace lo mismo con la descarga. Sin la función beta «enganchar vagones» (ajuste del mapa, desactivado por defecto) el tren de línea lleva dos locomotoras espalda con espalda, cambia de sentido en el cambio de sentido y recoge él mismo los vagones en la parada de recogida.

[ucy-sign]
arrive=Llegada: el tren de línea deja sus vagones
depart=Salida: el tren de línea espera, la locomotora de maniobras engancha los vagones preparados
ready=Preparación: la locomotora de maniobras coloca vagones para el tren de línea
load=Vías de carga: los insertadores cargan mineral
unload=Vías de descarga: los insertadores descargan
depot=Depósito de maniobras (locomotoras en ambos sentidos)
turn=Punto de cambio de sentido de la locomotora de maniobras
