scenario-name=UTL Coupling Yard – gran red
description=Gran red propia para observar: 4 × 3 rotondas con líneas de doble vía y señales, estaciones UTL y 36 trenes UTL que hacen entregas reales. Dos bloques tienen cada uno una instalación de enganche – una mina de mineral y una fábrica, cada una con estación de transferencia y estación de clasificación; un tren de línea viaja entre ambas a través de la red. Requiere Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – gran red[/font]: 36 trenes UTL hacen entregas por la red. El tren de línea lleva vagones vacíos a la mina (aquí), los deja, da la vuelta y se lleva los llenos; la locomotora de maniobras lleva los vagones a las vías de carga y de vuelta. La fábrica (abajo a la derecha) hace lo mismo con la descarga.

[ucy-sign]
arrive=Llegada: el tren de línea deja sus vagones
depart=Salida: el tren de línea se lleva los vagones preparados
ready=Preparación: la locomotora de maniobras coloca vagones para el tren de línea
load=Vías de carga: los insertadores cargan mineral
unload=Vías de descarga: los insertadores descargan
depot=Depósito de maniobras (locomotoras en ambos sentidos)
turn=Punto de cambio de sentido de la locomotora de maniobras
