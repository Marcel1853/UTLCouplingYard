scenario-name=UTL Coupling Yard – grand réseau
description=Grand réseau propre à regarder : 4 × 3 ronds-points avec lignes à double voie et signaux, des stations UTL et 36 trains UTL qui font de vraies livraisons. Deux blocs contiennent chacun une installation d'attelage – une mine de minerai et une usine, chacune avec une gare de transfert et une gare de triage ; un train de ligne circule entre les deux à travers le réseau. Nécessite Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – grand réseau[/font] : 36 trains UTL font des livraisons à travers le réseau. Le train de ligne amène des wagons vides à la mine (ici), les laisse, fait le tour et prend les pleins ; la locomotive de manœuvre amène les wagons aux voies de chargement et les ramène. L'usine (en bas à droite) fait de même avec le déchargement.

[ucy-sign]
arrive=Arrivée : le train de ligne laisse ses wagons
depart=Départ : le train de ligne prend les wagons préparés
ready=Mise à disposition : la locomotive de manœuvre place les wagons pour le train de ligne
load=Voies de chargement : les bras chargent du minerai
unload=Voies de déchargement : les bras déchargent
depot=Dépôt de manœuvre (locomotives dans les deux sens)
turn=Point de rebroussement de la locomotive de manœuvre
