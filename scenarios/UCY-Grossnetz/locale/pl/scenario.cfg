scenario-name=UTL Coupling Yard – duża sieć
description=Duża własna sieć do oglądania: 4 × 3 ronda z dwutorowymi liniami i sygnałami, stacje UTL i 33 pociągów UTL wykonujących prawdziwe dostawy. Dwa bloki mają po jednym urządzeniu do sprzęgania – kopalnię rudy i fabrykę, każda ze stacją przekazania i stacją rozrządową; pociąg liniowy jeździ między nimi przez sieć. Wymaga Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – duża sieć[/font]: 33 pociągi UTL wykonują dostawy w sieci. Pociąg liniowy (jedna lokomotywa z przodu) przywozi puste wagony do kopalni (tutaj), zostawia je, podjeżdża do przystanku odjazdu i tam czeka: lokomotywa manewrowa doczepia pełne wagony do jego końca, potem odjeżdża, ciągnąc je. Lokomotywa manewrowa przewozi też wagony na tory ładunkowe i z powrotem. Fabryka (prawy dolny róg) robi to samo z rozładunkiem. Bez funkcji beta „doczepianie wagonów” (ustawienie mapy, domyślnie wyłączone) pociąg liniowy ma dwie lokomotywy tyłem do siebie, zmienia kierunek na nawrotni i sam zabiera wagony z przystanku odbioru.

[ucy-sign]
arrive=Przyjazd: pociąg liniowy zostawia wagony
depart=Odjazd: pociąg liniowy czeka, lokomotywa manewrowa doczepia przygotowane wagony
ready=Przygotowanie: lokomotywa manewrowa podstawia wagony dla pociągu liniowego
load=Tory ładunkowe: podajniki ładują rudę
unload=Tory rozładunkowe: podajniki rozładowują
depot=Zajezdnia manewrowa (lokomotywy w obie strony)
turn=Punkt zmiany kierunku lokomotywy manewrowej
