scenario-name=UTL Coupling Yard – duża sieć
description=Duża własna sieć do oglądania: 4 × 3 ronda z dwutorowymi liniami i sygnałami, stacje UTL i 36 pociągów UTL wykonujących prawdziwe dostawy. Dwa bloki mają po jednym urządzeniu do sprzęgania – kopalnię rudy i fabrykę, każda ze stacją przekazania i stacją rozrządową; pociąg liniowy jeździ między nimi przez sieć. Wymaga Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – duża sieć[/font]: 36 pociągów UTL wykonuje dostawy w sieci. Pociąg liniowy przywozi puste wagony do kopalni (tutaj), zostawia je, objeżdża i zabiera pełne; lokomotywa manewrowa przewozi wagony na tory ładunkowe i z powrotem. Fabryka (prawy dolny róg) robi to samo z rozładunkiem.

[ucy-sign]
arrive=Przyjazd: pociąg liniowy zostawia wagony
depart=Odjazd: pociąg liniowy zabiera przygotowane wagony
ready=Przygotowanie: lokomotywa manewrowa podstawia wagony dla pociągu liniowego
load=Tory ładunkowe: podajniki ładują rudę
unload=Tory rozładunkowe: podajniki rozładowują
depot=Zajezdnia manewrowa (lokomotywy w obie strony)
turn=Punkt zmiany kierunku lokomotywy manewrowej
