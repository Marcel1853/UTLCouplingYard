scenario-name=UTL Coupling Yard – grande rede
description=Grande rede própria para assistir: 4 × 3 rotatórias com linhas de via dupla e sinais, estações UTL e 36 trens UTL fazendo entregas reais. Dois blocos têm cada um uma instalação de engate – uma mina de minério e uma fábrica, cada uma com pátio de transferência e pátio de manobras; um trem de linha viaja entre elas pela rede. Requer Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – grande rede[/font]: 36 trens UTL fazem entregas pela rede. O trem de linha leva vagões vazios até a mina (aqui), os deixa, faz a volta e leva os cheios; a locomotiva de manobra leva os vagões aos trilhos de carga e de volta. A fábrica (embaixo à direita) faz o mesmo com a descarga.

[ucy-sign]
arrive=Chegada: o trem de linha deixa seus vagões
depart=Partida: o trem de linha leva os vagões preparados
ready=Preparação: a locomotiva de manobra posiciona vagões para o trem de linha
load=Trilhos de carga: insersores carregam minério
unload=Trilhos de descarga: insersores descarregam
depot=Depósito de manobra (locomotivas nos dois sentidos)
turn=Ponto de retorno da locomotiva de manobra
