scenario-name=UTL Coupling Yard – grande rede
description=Grande rede própria para assistir: 4 × 3 rotatórias com linhas de via dupla e sinais, estações UTL e 33 trens UTL fazendo entregas reais. Dois blocos têm cada um uma instalação de engate – uma mina de minério e uma fábrica, cada uma com pátio de transferência e pátio de manobras; um trem de linha viaja entre elas pela rede. Requer Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – grande rede[/font]: 33 trens UTL fazem entregas pela rede. O trem de linha (uma locomotiva na frente) leva vagões vazios até a mina (aqui), os deixa, avança até a parada de partida e espera lá: a locomotiva de manobra engata os vagões cheios na sua traseira e então ele segue puxando-os. A locomotiva de manobra também leva os vagões aos trilhos de carga e de volta. A fábrica (embaixo à direita) faz o mesmo com a descarga. Sem o recurso beta "engatar vagões" (configuração do mapa, desligado por padrão) o trem de linha tem duas locomotivas de costas uma para a outra, faz o retorno no retorno de locomotiva e pega ele mesmo os vagões na parada de coleta.

[ucy-sign]
arrive=Chegada: o trem de linha deixa seus vagões
depart=Partida: o trem de linha espera, a locomotiva de manobra engata os vagões preparados
ready=Preparação: a locomotiva de manobra posiciona vagões para o trem de linha
load=Trilhos de carga: insersores carregam minério
unload=Trilhos de descarga: insersores descarregam
depot=Depósito de manobra (locomotivas nos dois sentidos)
turn=Ponto de retorno da locomotiva de manobra
