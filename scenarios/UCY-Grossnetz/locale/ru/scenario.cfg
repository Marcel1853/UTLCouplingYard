scenario-name=UTL Coupling Yard – большая сеть
description=Большая собственная сеть для наблюдения: 4 × 3 кольца с двухпутными линиями и сигналами, станции UTL и 36 поездов UTL с настоящими доставками. В двух кварталах по одной установке сцепки – рудник и завод, каждый с передаточной и сортировочной станцией; магистральный поезд ездит между ними через всю сеть. Требуется Unified Train Logistics.

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – большая сеть[/font]: 36 поездов UTL выполняют доставки по сети. Магистральный поезд привозит пустые вагоны на рудник (здесь), оставляет их, обгоняет и забирает полные; маневровый локомотив возит вагоны к путям погрузки и обратно. Завод (справа внизу) делает то же самое с разгрузкой.

[ucy-sign]
arrive=Прибытие: магистральный поезд оставляет вагоны
depart=Отправление: магистральный поезд забирает подготовленные вагоны
ready=Подача: маневровый локомотив ставит вагоны для магистрального поезда
load=Пути погрузки: манипуляторы грузят руду
unload=Пути разгрузки: манипуляторы разгружают
depot=Маневровое депо (локомотивы в обе стороны)
turn=Пункт разворота маневрового локомотива
