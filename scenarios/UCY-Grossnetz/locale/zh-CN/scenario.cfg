scenario-name=UTL Coupling Yard – 大型路网
description=可供观看的自建大型路网：4 × 3 个环岛，带双线铁路和信号，UTL 车站和 33 列执行真实配送的 UTL 列车。两个街区各有一套挂车设施——矿场和工厂，各自带有交接站和调车场；一列干线列车穿过路网往返于两者之间。需要 Unified Train Logistics。

[ucy-grossnetz]
welcome=[font=default-bold]UTL Coupling Yard – 大型路网[/font]：33 列 UTL 列车在路网中执行配送。干线列车（前部一台机车）把空车厢送到矿场（这里），留下它们，向前开到出发站并在那里等待：调车机车把满车厢挂到它的尾部，然后列车拉着车厢离开。调车机车还会把车厢送到装货线再送回来。工厂（右下）以同样方式卸货。 未开启测试版功能“挂上车厢”（地图设置，默认关闭）时，干线列车有两台背靠背的机车，在机车折返点调头，并在取车站自行挂上车厢。

[ucy-sign]
arrive=到达：干线列车留下车厢
depart=出发：干线列车等待，调车机车挂上备好的车厢
ready=备车：调车机车为干线列车摆好车厢
load=装货线：机械臂装矿石
unload=卸货线：机械臂卸货
depot=调车车库（机车可双向行驶）
turn=调车机车折返点
