scenario-name=UTL Coupling Yard – Rangierbahnhof
description=Großer Rangierbahnhof zum Anschauen: Greifarme beladen die Wagen auf den Abstellgleisen, die Rangierlok holt volle Wagen, wendet im Stummel und schiebt sie in eine freie Ladebucht. Dort wird entladen, leere Wagen kommen zurück. Darunter Vorführstrecken für Abstellen, Abholen, Tauschen und die Staffel mit einer echten UTL-Lieferung. Braucht Unified Train Logistics.

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – Rangierbahnhof[/font]: Oben arbeitet die Rangierlok: volle Wagen von den Abstellgleisen (links) in die Ladebuchten (rechts), leere zurück – sie wendet dafür im Stummel unten. Darunter laufen fünf Vorführstrecken (Abstellen, Abholen, Tauschen, Übergabe auf einem Gleis, Staffel), die nach jedem Durchgang von vorn beginnen. Stationsfenster öffnen: Rolle und Einstellungen stehen unter „UTL Coupling Yard“.

[ucy-sign]
siding=Abstellgleis: beladen, wenn voll → Ladebucht
bay=Ladebucht: entladen, wenn leer → Abstellgleis
depot=Rangierdepot (Lok in beide Richtungen)
turn=Wende: hier wechselt die Rangierlok die Richtung
drop=Abstellen: Wagen bleiben stehen, Lok fährt weiter
pickup=Abholen: Lok schiebt heran und kuppelt die Wagen
swap=Tauschen: eigene Wagen abstellen, wartende mitnehmen
handover=Übergabe auf einem Gleis: A schiebt heran und fährt rückwärts zurück, B holt von der Gegenseite ab
relay=Staffel: Lieferung bleibt beim Wagen, der nächste Zug bringt sie weiter
relay-provider=Anbieter (Greifarme laden)
relay-requester=Abnehmer mit Signal „Staffel 1“
