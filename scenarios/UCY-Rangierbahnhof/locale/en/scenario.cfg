scenario-name=UTL Coupling Yard – shunting yard
description=Large shunting yard to watch: inserters load the wagons on the sidings, the shunting locomotive fetches full wagons, turns in the stub and pushes them into a free loading bay. There they are unloaded, empty wagons come back. Below: demo tracks for leaving, picking up, swapping and the relay with a real UTL delivery. Requires Unified Train Logistics.

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – shunting yard[/font]: At the top the shunting locomotive works: full wagons from the sidings (left) into the loading bays (right), empty ones back – it turns in the stub at the bottom. Below run five demo tracks (leave, pick up, swap, handover on one track, relay) that start over after each run. Open a station window: role and settings are under "UTL Coupling Yard".

[ucy-sign]
siding=Siding: loading, when full → loading bay
bay=Loading bay: unloading, when empty → siding
depot=Shunting depot (locomotive both ways)
turn=Turnaround: the shunting locomotive changes direction here
drop=Leave: wagons stay, the locomotive carries on
pickup=Pick up: the locomotive moves up and couples the wagons
swap=Swap: leave own wagons, take the waiting ones
handover=Handover on one track: A pushes in and backs off, B picks up from the other side
relay=Relay: the delivery stays with the wagon, the next train takes it on
relay-provider=Provider (inserters load)
relay-requester=Requester with signal "relay 1"
