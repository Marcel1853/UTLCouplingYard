scenario-name=UTL Coupling Yard – estación de clasificación
description=Gran estación de clasificación para observar: los insertadores cargan los vagones en las vías muertas, la locomotora de maniobras recoge los vagones llenos, cambia de sentido en el ramal y los empuja a un muelle de carga libre. Allí se descargan y los vagones vacíos vuelven. Debajo: vías de demostración para dejar, recoger, intercambiar y el relevo con una entrega UTL real. Requiere Unified Train Logistics.

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – estación de clasificación[/font]: arriba trabaja la locomotora de maniobras: vagones llenos de las vías muertas (izquierda) a los muelles de carga (derecha) y vacíos de vuelta – cambia de sentido en el ramal de abajo. Debajo hay cinco vías de demostración (dejar, recoger, intercambiar, traspaso en una vía, relevo) que empiezan de nuevo tras cada recorrido. Abajo del todo, la línea larga: mina de mineral – estación de vagones con dos vías – estación de descarga; el tren de mineral cambia vagones llenos por vacíos. Abre la ventana de una estación: el rol y los ajustes están en «UTL Coupling Yard».

[ucy-sign]
siding=Vía muerta: carga, cuando está llena → muelle de carga
bay=Muelle de carga: descarga, cuando está vacío → vía muerta
depot=Depósito de maniobras (locomotora en ambos sentidos)
turn=Cambio de sentido: aquí la locomotora de maniobras cambia de sentido
drop=Dejar: los vagones se quedan, la locomotora sigue
pickup=Recoger: la locomotora se acerca y engancha los vagones
swap=Intercambiar: dejar los propios vagones, llevarse los que esperan
handover=Traspaso en una vía: A empuja y retrocede, B recoge desde el otro lado
relay=Relevo: la entrega se queda con el vagón, el siguiente tren la continúa
relay-provider=Proveedor (cargan los insertadores)
relay-requester=Solicitante con la señal «relevo 1»
ore=Mina de mineral: los insertadores cargan mineral
full-track=Vía llena: el tren de mineral empuja los vagones llenos, el tren B los recoge desde el otro lado
empty-track=Vía vacía: el tren B empuja los vagones vacíos, el tren de mineral los recoge
unload=Estación de descarga: descargan los insertadores
