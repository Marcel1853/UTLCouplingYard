scenario-name=UTL Coupling Yard – gare de triage
description=Grande gare de triage à regarder : des bras robotisés chargent les wagons sur les voies de garage, la locomotive de manœuvre va chercher les wagons pleins, rebrousse dans le tiroir et les pousse dans un quai de chargement libre. Ils y sont déchargés, les wagons vides reviennent. En dessous : voies de démonstration pour laisser, prendre, échanger et le relais avec une vraie livraison UTL. Nécessite Unified Train Logistics.

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – gare de triage[/font] : en haut travaille la locomotive de manœuvre : wagons pleins des voies de garage (à gauche) vers les quais de chargement (à droite), wagons vides en retour – elle rebrousse dans le tiroir en bas. En dessous, cinq voies de démonstration (laisser, prendre, échanger, transfert sur une voie, relais) qui recommencent après chaque passage. Tout en bas, la longue ligne : mine de minerai – gare de wagons à deux voies – gare de déchargement ; le train de minerai échange les wagons pleins contre des vides. Ouvrez une fenêtre de station : rôle et réglages se trouvent sous « UTL Coupling Yard ».

[ucy-sign]
siding=Voie de garage : chargement, une fois pleine → quai de chargement
bay=Quai de chargement : déchargement, une fois vide → voie de garage
depot=Dépôt de manœuvre (locomotive dans les deux sens)
turn=Rebroussement : la locomotive de manœuvre change de sens ici
drop=Laisser : les wagons restent, la locomotive repart
pickup=Prendre : la locomotive s'approche et attelle les wagons
swap=Échanger : laisser ses wagons, prendre ceux qui attendent
handover=Transfert sur une voie : A pousse et recule, B prend depuis l'autre côté
relay=Relais : la livraison reste avec le wagon, le train suivant la poursuit
relay-provider=Fournisseur (les bras chargent)
relay-requester=Demandeur avec le signal « relais 1 »
ore=Mine de minerai : les bras chargent du minerai
full-track=Voie pleine : le train de minerai pousse les wagons pleins, le train B les prend de l'autre côté
empty-track=Voie vide : le train B pousse les wagons vides, le train de minerai les prend
unload=Gare de déchargement : les bras déchargent
