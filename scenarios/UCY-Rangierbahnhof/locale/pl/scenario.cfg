scenario-name=UTL Coupling Yard – stacja rozrządowa
description=Duża stacja rozrządowa do oglądania: podajniki ładują wagony na torach odstawczych, lokomotywa manewrowa zabiera pełne wagony, zmienia kierunek na torze kończącym się kozłem i wpycha je do wolnego stanowiska ładunkowego. Tam są rozładowywane, puste wagony wracają. Poniżej: tory pokazowe dla zostawiania, zabierania, wymiany i sztafety z prawdziwą dostawą UTL. Wymaga Unified Train Logistics.

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – stacja rozrządowa[/font]: na górze pracuje lokomotywa manewrowa: pełne wagony z torów odstawczych (po lewej) na stanowiska ładunkowe (po prawej), puste z powrotem – zmienia kierunek na torze na dole. Poniżej jeździ pięć torów pokazowych (zostaw, zabierz, wymień, przekazanie na jednym torze, sztafeta), które zaczynają od nowa po każdym przejeździe. Na samym dole długa linia: kopalnia rudy – stacja wagonów z dwoma torami – stacja rozładunkowa; pociąg z rudą wymienia pełne wagony na puste. Otwórz okno stacji: rola i ustawienia są w sekcji „UTL Coupling Yard”.

[ucy-sign]
siding=Tor odstawczy: ładowanie, gdy pełny → stanowisko ładunkowe
bay=Stanowisko ładunkowe: rozładunek, gdy puste → tor odstawczy
depot=Zajezdnia manewrowa (lokomotywa w obie strony)
turn=Zmiana kierunku: tu lokomotywa manewrowa zmienia kierunek
drop=Zostaw: wagony zostają, lokomotywa jedzie dalej
pickup=Zabierz: lokomotywa podjeżdża i sprzęga wagony
swap=Wymień: zostaw własne wagony, zabierz czekające
handover=Przekazanie na jednym torze: A wpycha i się cofa, B zabiera z drugiej strony
relay=Sztafeta: dostawa zostaje przy wagonie, następny pociąg ją kontynuuje
relay-provider=Dostawca (ładują podajniki)
relay-requester=Odbiorca z sygnałem „sztafeta 1”
ore=Kopalnia rudy: podajniki ładują rudę
full-track=Tor pełnych: pociąg z rudą wpycha pełne wagony, pociąg B zabiera je z drugiej strony
empty-track=Tor pustych: pociąg B wpycha puste wagony, pociąg z rudą je zabiera
unload=Stacja rozładunkowa: podajniki rozładowują
