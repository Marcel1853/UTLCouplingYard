scenario-name=UTL Coupling Yard – pátio de manobras
description=Grande pátio de manobras para assistir: insersores carregam os vagões nos desvios, a locomotiva de manobra busca os vagões cheios, faz o retorno no ramal e os empurra para uma plataforma de carga livre. Lá eles são descarregados e os vagões vazios voltam. Abaixo: trilhos de demonstração para deixar, pegar, trocar e o revezamento com uma entrega UTL real. Requer Unified Train Logistics.

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – pátio de manobras[/font]: em cima trabalha a locomotiva de manobra: vagões cheios dos desvios (esquerda) para as plataformas de carga (direita), vazios de volta – ela faz o retorno no ramal de baixo. Abaixo correm cinco trilhos de demonstração (deixar, pegar, trocar, transferência em um trilho, revezamento) que recomeçam após cada passagem. Bem embaixo, a linha longa: mina de minério – pátio de vagões com dois trilhos – estação de descarga; o trem de minério troca vagões cheios por vazios. Abra a janela de uma estação: papel e ajustes ficam em "UTL Coupling Yard".

[ucy-sign]
siding=Desvio: carregando, quando cheio → plataforma de carga
bay=Plataforma de carga: descarregando, quando vazia → desvio
depot=Depósito de manobra (locomotiva nos dois sentidos)
turn=Retorno: aqui a locomotiva de manobra muda de sentido
drop=Deixar: os vagões ficam, a locomotiva segue
pickup=Pegar: a locomotiva se aproxima e engata os vagões
swap=Trocar: deixar os próprios vagões, levar os que esperam
handover=Transferência em um trilho: A empurra e recua, B pega pelo outro lado
relay=Revezamento: a entrega fica com o vagão, o próximo trem a continua
relay-provider=Fornecedor (insersores carregam)
relay-requester=Solicitante com o sinal "revezamento 1"
ore=Mina de minério: insersores carregam minério
full-track=Trilho cheio: o trem de minério empurra os vagões cheios, o trem B os pega pelo outro lado
empty-track=Trilho vazio: o trem B empurra os vagões vazios, o trem de minério os pega
unload=Estação de descarga: insersores descarregam
