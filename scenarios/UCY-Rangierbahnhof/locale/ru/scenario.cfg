scenario-name=UTL Coupling Yard – сортировочная станция
description=Большая сортировочная станция для наблюдения: манипуляторы грузят вагоны на запасных путях, маневровый локомотив забирает полные вагоны, разворачивается в тупике и заталкивает их на свободный пункт погрузки. Там их разгружают, пустые вагоны возвращаются. Ниже: демонстрационные пути для оставления, забора, обмена и эстафеты с настоящей доставкой UTL. Требуется Unified Train Logistics.

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – сортировочная станция[/font]: наверху работает маневровый локомотив: полные вагоны с запасных путей (слева) на пункты погрузки (справа), пустые обратно – разворачивается он в тупике внизу. Ниже работают пять демонстрационных путей (оставить, забрать, обменять, передача на одном пути, эстафета), которые начинаются заново после каждого прохода. В самом низу длинная линия: рудник – вагонная станция с двумя путями – станция разгрузки; рудный поезд меняет полные вагоны на пустые. Откройте окно станции: роль и настройки находятся в разделе «UTL Coupling Yard».

[ucy-sign]
siding=Запасной путь: погрузка, когда полон → пункт погрузки
bay=Пункт погрузки: разгрузка, когда пуст → запасной путь
depot=Маневровое депо (локомотив в обе стороны)
turn=Разворот: здесь маневровый локомотив меняет направление
drop=Оставить: вагоны остаются, локомотив едет дальше
pickup=Забрать: локомотив подъезжает и сцепляет вагоны
swap=Обменять: оставить свои вагоны, забрать ожидающие
handover=Передача на одном пути: A заталкивает и отъезжает, B забирает с другой стороны
relay=Эстафета: доставка остаётся с вагоном, следующий поезд везёт её дальше
relay-provider=Поставщик (грузят манипуляторы)
relay-requester=Получатель с сигналом «эстафета 1»
ore=Рудник: манипуляторы грузят руду
full-track=Путь полных: рудный поезд заталкивает полные вагоны, поезд B забирает их с другой стороны
empty-track=Путь пустых: поезд B заталкивает пустые вагоны, рудный поезд их забирает
unload=Станция разгрузки: манипуляторы разгружают
