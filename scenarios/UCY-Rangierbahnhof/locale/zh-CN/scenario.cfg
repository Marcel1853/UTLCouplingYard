scenario-name=UTL Coupling Yard – 调车场
description=可供观看的大型调车场：机械臂在停车线上装车，调车机车取走装满的车厢，在尽头线折返，再推入空闲的装卸位。车厢在那里卸货，空车厢再送回来。下方：留下、挂上、交换以及使用真实 UTL 配送的接力演示线路。需要 Unified Train Logistics。

[ucy-scenario]
welcome=[font=default-bold]UTL Coupling Yard – 调车场[/font]：上方是调车机车的工作区：把满车厢从停车线（左）送到装卸位（右），再把空车厢送回——它在下方的尽头线折返。下面有五条演示线路（留下、挂上、交换、单线交接、接力），每轮结束后重新开始。最下方是长线路：矿场 – 两条线的车厢场 – 卸货站；运矿列车用满车厢换空车厢。打开车站窗口：角色和设置位于“UTL Coupling Yard”下。

[ucy-sign]
siding=停车线：装货，满时 → 装卸位
bay=装卸位：卸货，空时 → 停车线
depot=调车车库（机车可双向行驶）
turn=折返点：调车机车在这里改变方向
drop=留下：车厢留下，机车继续行驶
pickup=挂上：机车靠近并挂上车厢
swap=交换：留下自己的车厢，带走等待的车厢
handover=单线交接：A 推入后倒车离开，B 从另一侧挂走
relay=接力：配送随车厢保留，下一列车继续运送
relay-provider=供应站（机械臂装货）
relay-requester=带“接力 1”信号的需求站
ore=矿场：机械臂装矿石
full-track=满车线：运矿列车推入满车厢，B 列车从另一侧挂走
empty-track=空车线：B 列车推入空车厢，运矿列车挂走
unload=卸货站：机械臂卸货
